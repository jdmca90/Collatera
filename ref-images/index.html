<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference Image Library · Collatera</title>
<meta name="description" content="A personal clinical reference image library.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div class="rf-bg" aria-hidden="true"></div>
<div class="rf-wash" aria-hidden="true"></div>
<div class="rf-slab" aria-hidden="true"></div>

<!-- Search + filter chips (the shared header/banner are injected by site.js above) -->
<div class="controls">
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" class="search-input" type="search" placeholder="Search titles, notes, tags…" autocomplete="off" aria-label="Search the library">
  </div>
  <div class="chips" id="chips" role="tablist" aria-label="Filter by category or tag"></div>
</div>

<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <strong>Nothing found</strong>
    Try a different word, or pick a different category or tag above.
  </div>
</main>

<footer>collatera.org &middot; a growing resource for physician innovators &middot; est. 2026</footer>

<!-- ---------- Lightbox markup ---------- -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <button class="lb-close" id="lbClose" aria-label="Close">&#10005;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  <div class="lb-card">
    <div class="lb-imgarea"><div class="lb-imgpanel"><img id="lbImg" src="" alt=""></div></div>
    <div class="lb-banner">
      <span class="lb-fav" id="lbFav" role="button" tabindex="0" hidden aria-pressed="false" aria-label="Add to favorites">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6-5.9-3.2-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9z"/></svg>
      </span>
      <span class="lb-edit" id="lbEdit" role="button" tabindex="0" hidden aria-label="Edit card">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zM12 8V4m0 16v-4m5.66-9.66l-2.83 2.83M9.17 14.83l-2.83 2.83M20 12h-4M8 12H4m12.66 5.66l-2.83-2.83M9.17 9.17L6.34 6.34"/></svg>
      </span>
      <div class="lb-badges" id="lbTagRow"></div>
      <div class="lb-lower">
        <div class="lb-title" id="lbTitle"></div>
        <div class="lb-caption" id="lbNote"></div>
      </div>
    </div>
  </div>
</div>

<style id="lbCardStyle">
  /* redesigned expanded-card (lightbox) — theme-adaptive: white in light, charcoal in dark */
  :root{ --lbcard-bg:#FBFAF6; --lbcard-title:#201E1C; --lbcard-cap:#5F5B54; --lbcard-staron:#C9971F; --lbcard-staroff:#C6C0B6; }
  :root[data-theme="dark"]{ --lbcard-bg:#232323; --lbcard-title:#F5F2EC; --lbcard-cap:#B9B3A8; --lbcard-staron:#F2B138; --lbcard-staroff:#847E74; }
  @media (prefers-color-scheme:dark){ :root[data-theme="auto"]{ --lbcard-bg:#232323; --lbcard-title:#F5F2EC; --lbcard-cap:#B9B3A8; --lbcard-staron:#F2B138; --lbcard-staroff:#847E74; } }
  :root{ --lbtag-bg:#59636D; --lbtag-ink:#F5F2EC; --lb-badgeH:34px; }

  .lb-card{ background:var(--lbcard-bg); border-radius:15px; max-width:min(1000px,94vw); width:max-content;
    max-height:92vh; overflow:auto; display:flex; flex-direction:column; box-shadow:0 30px 80px rgba(0,0,0,.5); animation:pop .25s ease; }
  .lb-card .lb-imgarea{ padding:11px 11px 0; }
  .lb-card .lb-imgpanel{ background:#fff; border:1px solid #CDD2D9; border-bottom:none; border-radius:7px 7px 0 0; padding:2px 2px 0; }
  .lb-card .lb-imgpanel img{ display:block; width:100%; height:auto; max-height:70vh; object-fit:contain; border-radius:4px 4px 0 0; }

  .lb-card .lb-banner{ position:relative; padding:10px 14px 16px; }
  .lb-card .lb-badges{ display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding-right:74px; }
  .lb-card .lb-badges .lb-cat,
  .lb-card .lb-badges .lb-tag{ height:var(--lb-badgeH); display:inline-flex; align-items:center; font-size:15px;
    border-radius:999px; padding:0 .66em; white-space:nowrap; border:none; }
  .lb-card .lb-badges .lb-cat{ font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:var(--pill-ink); }
  .lb-card .lb-badges .lb-tag{ font-weight:600; background:var(--lbtag-bg); color:var(--lbtag-ink); }
  .lb-card .lb-badges .lb-tag::before{ content:none; }

  .lb-card .lb-fav{ position:absolute; top:10px; right:12px; width:60px; height:60px; cursor:pointer;
    display:grid; place-items:center; color:var(--lbcard-staroff); }
  .lb-card .lb-fav svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.6; }
  .lb-card .lb-fav.is-on{ color:var(--lbcard-staron); }
  .lb-card .lb-edit{ position:absolute; top:76px; right:12px; width:60px; height:60px; cursor:pointer;
    display:grid; place-items:center; color:var(--lbcard-staroff); }
  .lb-card .lb-edit svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.6; }
  .lb-card .lb-fav.is-on svg{ fill:currentColor; }

  .lb-card .lb-lower{ margin-top:16px; }
  .lb-card .lb-title{ max-width:80%; font-size:40px; font-weight:800; line-height:1.08; color:var(--lbcard-title);
    font-family:"Gill Sans MT","Hanken Grotesk",sans-serif; overflow-wrap:anywhere; }
  .lb-card .lb-caption{ max-width:90%; margin-top:16px; font-size:18px; line-height:1.3; color:var(--lbcard-cap); }
  .lb-card .lb-caption:empty{ display:none; }
  @media (max-width:560px){
    .lb-card .lb-title{ font-size:30px; max-width:100%; }
    .lb-card .lb-caption{ max-width:100%; }
    .lb-card .lb-fav{ width:48px; height:48px; }
    .lb-card .lb-edit{ width:48px; height:48px; top:62px; }
    .lb-card .lb-badges{ padding-right:60px; }
  }
</style>

<!-- shared header / nav / banner -->
<script>window.COLLATERA_SECTION = "Reference Image Library";</script>
<script src="/assets/site.js"></script>

<script>
/* =================================================================
   ====   YOUR LIBRARY LIVES HERE  —  THIS IS THE ONLY PART     ====
   ====   YOU NEED TO EDIT TO ADD OR CHANGE IMAGES.             ====
   =================================================================

   Each image has:
     file:  "/images/your-file.jpg"   the picture, kept in the /images
                                       folder at the top of your repo
     title: "What it's called"         shown under the thumbnail
     cat:   "Echo"                     ONE primary category (must match
                                       a name in CATEGORIES below)
     tags:  ["AV", "LV"]               ANY number of cross-cutting tags;
                                       one tag can appear across several
                                       categories (e.g. AV in Echo AND Valves)
     note:  "A short description."     optional — shows only when the
                                       image is opened, not on the thumbnail

   Categories appear as the first group of filter chips; tags appear
   after the divider. Clicking either filters across the whole library.

   NOTE: the entries below are placeholders so you can see the layout.
   Your 108 real entries (generated from your Excel) replace this block.
   ================================================================= */

let CATEGORIES = [];
let IMAGES = [];
let ALL_TAGS = [];

const catColors = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const colorFor = (cat) => {
  const i = CATEGORIES.indexOf(cat);
  return i >= 0 ? catColors[i % catColors.length] : "var(--border)";
};
  
const grid    = document.getElementById("grid");
const chipsEl = document.getElementById("chips");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const searchEl= document.getElementById("search");

let activeFilter = { type: "all", value: null };  // single-select
let query = "";
let visible = [];

/* ----- build the unified chip row: All · categories · | · tags ----- */
function chipButton(label, type, value, isTag) {
  const b = document.createElement("button");
  b.className = "chip" + (isTag ? " is-tag" : "");
  b.textContent = label;
  b.setAttribute("role","tab");
  const pressed = activeFilter.type === type && activeFilter.value === value;
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.onclick = () => {
    activeFilter = { type, value };
    [...chipsEl.querySelectorAll(".chip")].forEach(c => c.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    render();
  };
  return b;
}
function buildChips() {
  chipsEl.appendChild(chipButton("All", "all", null, false));
  // account-based modes (shown only when signed in)
  const starred = chipButton("Starred", "starred", null, false);
  starred.classList.add("is-mode"); starred.classList.remove("is-tag"); starred.id = "chipStarred";
  const recent = chipButton("Recently viewed", "recentviewed", null, false);
  recent.classList.add("is-mode"); recent.classList.remove("is-tag"); recent.id = "chipRecent";
  chipsEl.appendChild(starred); chipsEl.appendChild(recent);
  updateModeChips();
  const sep0 = document.createElement("span"); sep0.className = "chip-sep"; sep0.setAttribute("aria-hidden","true");
  chipsEl.appendChild(sep0);
  CATEGORIES.forEach(cat => chipsEl.appendChild(chipButton(cat, "cat", cat, false)));
  if (ALL_TAGS.length) {
    const sep = document.createElement("span");
    sep.className = "chip-sep"; sep.setAttribute("aria-hidden","true");
    chipsEl.appendChild(sep);
    ALL_TAGS.forEach(tag => chipsEl.appendChild(chipButton(tag, "tag", tag, true)));
  }
}

/* ----- render the gallery ----- */
function matchesFilter(img) {
  if (activeFilter.type === "all") return true;
  if (activeFilter.type === "cat") return img.cat === activeFilter.value;
  if (activeFilter.type === "tag") return (img.tags || []).includes(activeFilter.value);
  if (activeFilter.type === "starred") return FAVES.has(img.id);
  if (activeFilter.type === "recentviewed") return RECENTS.has(img.id);
  return true;
}
function render() {
  const q = query.trim().toLowerCase();
  const mode = activeFilter.type;

  visible = IMAGES.filter(img => {
    if (!matchesFilter(img)) return false;
    if (window.EchoMode && EchoMode.on && img.cat !== "Echo") return false;
    const hay = (img.title + " " + img.cat + " " + (img.note||"") + " " + (img.tags||[]).join(" ")).toLowerCase();
    if (q && !hay.includes(q)) return false;
    return true;
  });

  // Tiered ordering for signed-in users: starred first, then recently
  // viewed within RECENT_WINDOW_DAYS (newest first), then everything else
  // in library order. The "Recently viewed" chip sorts purely by recency.
  if (mode === "recentviewed") {
    visible.sort((a,b) => (RECENTS.get(b.id)||0) - (RECENTS.get(a.id)||0));
  } else if (ME) {
    const cutoff = Date.now() - RECENT_WINDOW_DAYS * 86400000;
    const tier = (im) => {
      if (FAVES.has(im.id)) return 0;
      const t = RECENTS.get(im.id) || 0;
      return t >= cutoff ? 1 : 2;
    };
    visible = visible
      .map((im, i) => ({ im, i, t: tier(im) }))
      .sort((a,b) => {
        if (a.t !== b.t) return a.t - b.t;
        // within the recent tier, newest first; other tiers keep library order
        if (a.t === 1) return (RECENTS.get(b.im.id)||0) - (RECENTS.get(a.im.id)||0);
        return a.i - b.i;
      })
      .map(x => x.im);
  }

  grid.innerHTML = "";
  if (window.EchoMode && EchoMode.on) { buildEchoLayout(visible); }
  else {
  grid.className = "grid";
  visible.forEach((img, i) => {
    const card = document.createElement("button");
    card.className = "card";
    card.style.setProperty("--cat", colorFor(img.cat));
    card.style.animationDelay = (Math.min(i, 18) * 0.03) + "s";
    card.onclick = () => openLightbox(i);
    card.innerHTML = `
      <img class="thumb" src="${encodeURI(img.file)}" alt="${img.title}" loading="lazy"
           onerror="this.style.opacity=.4;this.alt='Image not found \u2014 check the file name';">
      <div class="card-body">
        <span class="card-cat" style="background:${colorFor(img.cat)}">${img.cat}</span>
        <span class="card-title">${img.title}</span>
      </div>`;
    if (ME) card.appendChild(makeStar(img));
    grid.appendChild(card);
  });
  }

  const n = visible.length;
  let label = `${n} ${n === 1 ? "image" : "images"}`;
  if (activeFilter.type === "cat") label += ` in ${activeFilter.value}`;
  if (activeFilter.type === "tag") label += ` tagged #${activeFilter.value}`;
  if (mode === "starred") label += ` \u00b7 starred`;
  if (mode === "recentviewed") label += ` \u00b7 recently viewed`;
  if (q) label += ` matching \u201c${query.trim()}\u201d`;
  countEl.textContent = label;
  emptyEl.style.display = n ? "none" : "block";
  grid.style.display = n ? ((window.EchoMode && EchoMode.on) ? "block" : "grid") : "none";
}

/* ============================================================
   Echo reader mode — groups Echo-category cards into an
   echoguide-style reading protocol. Sections are keyed to tags;
   a card can appear in several sections. State persists in
   localStorage across refresh and is cleared on sign-out
   (handled in the auth listener below).
   ============================================================ */
function echoHas(img, t){ return (img.tags || []).indexOf(t) >= 0; }

var ECHO_SECTIONS = [
  { name: "Views / Orientation",        match: function(im){ return echoHas(im,"Views"); } },
  { name: "Key Equations",              match: function(im){ return echoHas(im,"math"); } },
  { name: "Left Ventricle",             match: function(im){ return echoHas(im,"LV"); } },
  { name: "Diastology",                 match: function(im){ return echoHas(im,"diastology"); } },
  { name: "Right Ventricle",            match: function(im){ return echoHas(im,"RV"); } },
  { name: "Left Atrium",                match: function(im){ return echoHas(im,"LA"); } },
  { name: "Right Atrium",               match: function(im){ return echoHas(im,"RA"); } },
  { name: "Aorta",                      match: function(im){ return echoHas(im,"Aorta"); } },
  { name: "Aortic Regurgitation",       match: function(im){ return echoHas(im,"AR") && !echoHas(im,"Pros"); } },
  { name: "Aortic Stenosis",            match: function(im){ return echoHas(im,"AS") && !echoHas(im,"Pros"); } },
  { name: "Mitral Regurgitation",       match: function(im){ return echoHas(im,"MR") && !echoHas(im,"Pros"); } },
  { name: "Mitral Stenosis",            match: function(im){ return echoHas(im,"MS") && !echoHas(im,"Pros"); } },
  { name: "Tricuspid Regurgitation",    match: function(im){ return echoHas(im,"TR") && !echoHas(im,"Pros"); } },
  { name: "Tricuspid Stenosis",         match: function(im){ return echoHas(im,"TS") && !echoHas(im,"Pros"); } },
  { name: "Pulmonic Regurgitation",     match: function(im){ return echoHas(im,"PR") && !echoHas(im,"Pros"); } },
  { name: "Pulmonic Stenosis",          match: function(im){ return echoHas(im,"PS") && !echoHas(im,"Pros"); } },
  { name: "IVC",                        match: function(im){ return echoHas(im,"IVC"); } },
  { name: "Prosthetic Aortic Valve",    match: function(im){ return echoHas(im,"Pros") && echoHas(im,"AV"); } },
  { name: "Prosthetic Mitral Valve",    match: function(im){ return echoHas(im,"Pros") && echoHas(im,"MV"); } },
  { name: "Prosthetic Tricuspid Valve", match: function(im){ return echoHas(im,"Pros") && echoHas(im,"TV"); } },
  { name: "Prosthetic Pulmonic Valve",  match: function(im){ return echoHas(im,"Pros") && echoHas(im,"PV"); } }
];

function makeEchoCard(img, i){
  var card = document.createElement("button");
  card.className = "card";
  card.setAttribute("data-echo-title", img.title);
  card.style.setProperty("--cat", colorFor(img.cat));
  card.style.animationDelay = (Math.min(i, 24) * 0.02) + "s";
  card.onclick = function(e){ e.stopPropagation(); openLightbox(i); };
  var im = document.createElement("img");
  im.className = "thumb"; im.loading = "lazy";
  im.src = encodeURI(img.file); im.alt = img.title;
  im.onerror = function(){ this.style.opacity = 0.4; };
  var body = document.createElement("div"); body.className = "card-body";
  var ttl = document.createElement("span"); ttl.className = "card-title"; ttl.textContent = img.title;
  body.appendChild(ttl);
  card.appendChild(im); card.appendChild(body);
  if (ME) card.appendChild(makeStar(img));
  return card;
}

function makeEchoThumb(img, i, sectionName){
  var t = document.createElement("button");
  t.className = "echo-thumb";
  t.setAttribute("data-echo-title", img.title);
  t.title = img.title;
  t.style.animationDelay = (Math.min(i, 30) * 0.015) + "s";
  t.onclick = function(e){
    e.stopPropagation();
    if (window.EchoMode) EchoMode.open(sectionName);
    openLightbox(i);
  };
  var im = document.createElement("img");
  im.loading = "lazy"; im.src = encodeURI(img.file); im.alt = img.title;
  im.onerror = function(){ this.style.opacity = 0.35; };
  t.appendChild(im);
  return t;
}

function echoSectionEl(name, members, list, isOpen){
  var wrap = document.createElement("div");
  wrap.className = "echo-section" + (isOpen ? " is-open" : "");
  wrap.setAttribute("data-echo-section", name);
  wrap.onclick = function(){ if (window.EchoMode) EchoMode.toggle(name); };

  var head = document.createElement("button");
  head.className = "echo-head"; head.type = "button";
  head.setAttribute("aria-expanded", isOpen ? "true" : "false");
  var nm = document.createElement("span"); nm.className = "eh-name"; nm.textContent = name;
  head.appendChild(nm);

  var cards = document.createElement("div");
  cards.className = "echo-cards " + (isOpen ? "expanded" : "collapsed");
  members.forEach(function(img){
    var idx = list.indexOf(img);
    cards.appendChild(isOpen ? makeEchoCard(img, idx) : makeEchoThumb(img, idx, name));
  });

  wrap.appendChild(head); wrap.appendChild(cards);
  return wrap;
}

function buildEchoLayout(list){
  grid.className = "echo-wrap";
  grid.innerHTML = "";
  var open = (window.EchoMode && EchoMode.openSection) || null;
  var homed = {};
  ECHO_SECTIONS.forEach(function(sec){
    var members = list.filter(sec.match);
    if (!members.length) return;               // empty sections don't render
    members.forEach(function(im){ homed[im.id] = 1; });
    grid.appendChild(echoSectionEl(sec.name, members, list, open === sec.name));
  });
  var orphans = list.filter(function(im){ return !homed[im.id]; });
  if (orphans.length) grid.appendChild(echoSectionEl("Other", orphans, list, open === "Other"));
  requestAnimationFrame(echoReflow);
}

/* one native row -> spill to a 2nd row -> beyond that, a 2-row-tall
   horizontally scrollable strip. Applies to collapsed thumbs and
   expanded cards alike. */
function echoReflow(){
  var maxRows = 2;
  try {
    var mr = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--ov-rows"), 10);
    if (mr) maxRows = mr;
  } catch(e){}
  var rows = document.querySelectorAll(".echo-cards");
  for (var r = 0; r < rows.length; r++){
    var el = rows[r];
    el.classList.remove("ov-1row", "ov-2row", "ov-scroll");
    var items = [].slice.call(el.children).filter(function(c){ return c.style.display !== "none"; });
    var count = items.length;
    if (!count) continue;
    var cs = getComputedStyle(el);
    var gap = parseFloat(cs.columnGap || cs.gap) || 8;
    var iw = items[0].getBoundingClientRect().width || 100;
    var avail = el.clientWidth || el.getBoundingClientRect().width || 1;
    var perRow = Math.max(1, Math.floor((avail + gap) / (iw + gap)));
    el.style.setProperty("--ov-col", iw + "px");
    if (count <= perRow) el.classList.add("ov-1row");
    else if (count <= perRow * maxRows) el.classList.add("ov-2row");
    else el.classList.add("ov-scroll");
  }
}

function collapseEchoSections(){
  var secs = document.querySelectorAll(".echo-section");
  for (var k = 0; k < secs.length; k++){
    var cs = secs[k].querySelectorAll(".card, .echo-thumb"), any = false;
    for (var j = 0; j < cs.length; j++){ if (cs[j].style.display !== "none"){ any = true; break; } }
    secs[k].style.display = any ? "" : "none";
  }
}

var _echoResizeT = null;
window.addEventListener("resize", function(){
  if (!window.EchoMode || !EchoMode.on) return;
  clearTimeout(_echoResizeT); _echoResizeT = setTimeout(echoReflow, 120);
});

window.EchoMode = {
  on: false,
  openSection: null,           // accordion: name of the one open section, or null
  enable: function(){
    this.on = true; this.openSection = null; document.body.classList.add("echo-view");
    try { localStorage.setItem("collateraEchoMode", "1"); } catch(e){}
    render();
  },
  disable: function(){
    this.on = false; this.openSection = null; document.body.classList.remove("echo-view");
    try { localStorage.removeItem("collateraEchoMode"); } catch(e){}
    if (grid) grid.className = "grid";
    var btns = document.querySelectorAll(".sb-btn");
    for (var k = 0; k < btns.length; k++){
      if (btns[k].textContent.trim().indexOf("Echo reader") === 0) btns[k].setAttribute("aria-pressed", "false");
    }
    render();
  },
  open:  function(name){ this.openSection = name; render(); },
  close: function(){ this.openSection = null; render(); },
  toggle:function(name){ if (this.openSection === name) this.close(); else this.open(name); },
  restore: function(){ try { return localStorage.getItem("collateraEchoMode") === "1"; } catch(e){ return false; } },
  collapse: function(){ collapseEchoSections(); echoReflow(); }
};

/* ----- lightbox (title, category, tags, note all appear here) ----- */
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbTitle = document.getElementById("lbTitle");
const lbNote = document.getElementById("lbNote");
const lbTagRow = document.getElementById("lbTagRow");
let lbIndex = 0;

function openLightbox(i) {
  lbIndex = i; showLb();
  const img = visible[lbIndex];
  if (img) CollateraViews.record(img.file);
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("lbClose").focus();
}
function showLb() {
  const img = visible[lbIndex];
  if (!img) return;
  lbImg.src = encodeURI(img.file); lbImg.alt = img.title;
  lbTitle.textContent = img.title;
  lbNote.textContent = img.note || "";   // blank -> :empty hides it; banner then sits 16px below the title
  lbTagRow.innerHTML =
    `<span class="lb-cat" style="background:${colorFor(img.cat)}">${img.cat}</span>` +
    (img.tags||[]).map(t => `<span class="lb-tag">${t}</span>`).join("");
 const fav = document.getElementById("lbFav");
  if (ME) {
    fav.hidden = false; fav.dataset.cfavId = img.id;
    const on = FAVES.has(img.id);
    fav.classList.toggle("is-on", on);
    fav.setAttribute("aria-pressed", on ? "true" : "false");
    fav.setAttribute("aria-label", on ? "Remove from favorites" : "Add to favorites");
  } else { fav.hidden = true; }
  const editIcon = document.getElementById("lbEdit");
  if (window.collateraIsAdmin) { editIcon.hidden = false; editIcon.dataset.imgId = img.id; }
  else { editIcon.hidden = true; }
}
/* favorite toggle in the redesigned banner (signed-in only; reuses toggleFav/FAVES) */
(function wireLbFav(){
  const fav = document.getElementById("lbFav"); if (!fav) return;
  const act = (e) => {
    e.preventDefault(); e.stopPropagation();
    const id = fav.dataset.cfavId; if (!id) return;
    toggleFav(id);
    const on = FAVES.has(id);
    fav.classList.toggle("is-on", on);
    fav.setAttribute("aria-pressed", on ? "true" : "false");
    fav.setAttribute("aria-label", on ? "Remove from favorites" : "Add to favorites");
  };
  fav.addEventListener("click", act);
  fav.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") act(e); });
})();
function closeLb() { lb.classList.remove("open"); document.body.style.overflow = ""; }
function step(d) { lbIndex = (lbIndex + d + visible.length) % visible.length; showLb(); }
document.getElementById("lbClose").onclick = closeLb;
document.getElementById("lbPrev").onclick = () => step(-1);
document.getElementById("lbNext").onclick = () => step(1);
lb.onclick = (e) => { if (e.target === lb) closeLb(); };
document.addEventListener("keydown", (e) => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

searchEl.addEventListener("input", (e) => { query = e.target.value; render(); });

/* ----- load the library from images.json, then go ----- */
fetch("/data/images.json")
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(data => {

    IMAGES = data.images || [];
    ALL_TAGS = [...new Set(IMAGES.flatMap(img => img.tags || []))].sort((a,b)=>a.localeCompare(b));
    buildChips();
    render();
  })
  .catch(err => {

    emptyEl.innerHTML = `<strong>Couldn't load the image library</strong><br>Check that /data/images.json exists at the repo root and is valid JSON.<br><span style="opacity:.7">${err.message}</span>`;
  });
  /* =================================================================
   FAVORITES  (per-user, requires login) — 7a-ii
   Adds a star to each card (signed-in only). Starring writes a row
   to the RLS-protected `favorites` table; starred items float to the
   front on the next render. Logged out, none of this appears.
   Relies on window.sb / window.sbReady from site.js.
   ================================================================= */
let FAVES = new Set();   // item_ids the signed-in user has starred (source=image)
let ME    = null;        // signed-in user's id, or null when logged out

(function injectFavCss(){
  const s = document.createElement("style");
  s.textContent = `
    .card{position:relative}
    .cfav-star{position:absolute;top:.4rem;right:.4rem;z-index:2;
      width:1.9rem;height:1.9rem;display:flex;align-items:center;justify-content:center;
      font-size:1.15rem;line-height:1;border-radius:50%;cursor:pointer;border:none;
      background:rgba(0,0,0,.34);color:#fff;transition:transform .1s ease, background .15s}
    .cfav-star:hover{transform:scale(1.12);background:rgba(0,0,0,.52)}
    .cfav-star.is-on{color:#FFD24A}
    .cfav-star:focus-visible{outline:2px solid var(--accent,#85CCCC);outline-offset:2px}
  `;
  document.head.appendChild(s);
})();

function setStar(s, on){
  s.classList.toggle("is-on", on);
  s.textContent = on ? "\u2605" : "\u2606";       // ★ / ☆
  s.setAttribute("aria-pressed", on ? "true" : "false");
  s.setAttribute("aria-label", on ? "Remove from favorites" : "Add to favorites");
}

function makeStar(img){
  const on = FAVES.has(img.id);
  const s = document.createElement("span");
  s.className = "cfav-star";
  s.dataset.cfavId = img.id;
  s.setAttribute("role", "button");
  s.setAttribute("tabindex", "0");
  setStar(s, on);
  const activate = (e) => { e.preventDefault(); e.stopPropagation(); toggleFav(img.id); };
  s.addEventListener("click", activate);
  s.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") activate(e); });
  return s;
}

async function toggleFav(id){
  if (!ME || !window.sb) return;
  const wasOn = FAVES.has(id);
  // optimistic: flip every star for this item, reconcile with the server
  if (wasOn) FAVES.delete(id); else FAVES.add(id);
  syncStars(id);
  let error;
  if (wasOn) {
    ({ error } = await window.sb.from("favorites").delete()
        .eq("item_id", id).eq("source", "image"));
  } else {
    ({ error } = await window.sb.from("favorites")
        .upsert({ user_id: ME, item_id: id, source: "image" }, { onConflict: "user_id,item_id" }));
  }
  if (error) {
    if (wasOn) FAVES.add(id); else FAVES.delete(id);
    syncStars(id);
    console.warn("favorite toggle failed:", error.message);
  }
}

async function loadFaves(){
  const sb = await window.sbReady;
  const { data: { session } } = await sb.auth.getSession();
  ME = session?.user?.id || null;
  FAVES = new Set();
  if (ME) {
    const { data, error } = await sb.from("favorites").select("item_id").eq("source", "image");
    if (!error && data) for (const row of data) FAVES.add(row.item_id);
  }
}

(function initUser(){
  if (!window.sbReady) { setTimeout(initUser, 50); return; }   // wait for site.js
  window.sbReady.then(async (sb) => {
    await loadFaves(); await loadRecents(); updateModeChips(); render();
    sb.auth.onAuthStateChange(async (event) => {
      if (event === "SIGNED_OUT" && window.EchoMode) EchoMode.disable();
      await loadFaves(); await loadRecents(); updateModeChips(); render();
    });
  });
})();


/* =================================================================
   RECENTS + mode-chip visibility — account-based "Recently viewed".
   Records each image open into recent_views, loads a user's recents,
   and shows/hides the Starred & Recently-viewed chips with login state.
   ================================================================= */
let RECENTS = new Map();   // item_id -> viewed_at (ms) for the signed-in user

async function loadRecents(){
  RECENTS = new Map();
  if (!ME || !window.sb) return;
  const { data, error } = await window.sb.from("recent_views")
    .select("item_id, viewed_at").eq("source", "image");
  if (!error && data) for (const row of data) RECENTS.set(row.item_id, new Date(row.viewed_at).getTime());
}

async function recordView(img){
  if (!ME || !window.sb || !img) return;
  RECENTS.set(img.id, Date.now());
  const { error } = await window.sb.from("recent_views")
    .upsert({ user_id: ME, item_id: img.id, source: "image", viewed_at: new Date().toISOString() },
            { onConflict: "user_id,item_id" });
  if (error) console.warn("recordView failed:", error.message);
}

function updateModeChips(){
  const show = !!ME;
  const cs = document.getElementById("chipStarred");
  const cr = document.getElementById("chipRecent");
  if (cs) cs.style.display = show ? "" : "none";
  if (cr) cr.style.display = show ? "" : "none";
  if (!show && (activeFilter.type === "starred" || activeFilter.type === "recentviewed")) {
    activeFilter = { type: "all", value: null };
    const chips = [...chipsEl.querySelectorAll(".chip")];
    chips.forEach(c => c.setAttribute("aria-pressed","false"));
    if (chips[0]) chips[0].setAttribute("aria-pressed","true");
  }
}

/* record each image open to the account (local tracker still runs too) */
(function patchOpenForRecents(){
  const _origOpen = openLightbox;
  openLightbox = function(i){ _origOpen(i); recordView(visible[i]); };
})();



/* =================================================================
   TIERED ORDERING SUPPORT + lightbox star
   RECENT_WINDOW_DAYS controls how long a viewed image keeps floating.
   syncStars keeps the card star and the lightbox star in agreement.
   ================================================================= */
const RECENT_WINDOW_DAYS = 14;

function syncStars(id){
  document.querySelectorAll('.cfav-star[data-cfav-id="' + id + '"]')
    .forEach(el => setStar(el, FAVES.has(id)));
}

/* The lightbox favorite toggle and banner are now rendered natively by the
   redesigned card (see the lightbox markup, .lb-card styles, showLb, and
   wireLbFav below). */

/* profile panel cleared the history -> drop it locally and re-render */
document.addEventListener("collatera:recents-cleared", () => {
  RECENTS = new Map();
  if (activeFilter.type === "recentviewed") activeFilter = { type: "all", value: null };
  render();
});

/* open section: header enlarges, bolds, takes the accent color */
.echo-section.is-open .echo-head .eh-name{
  font-size:var(--eh-fs); font-weight:800; letter-spacing:0;
  color:var(--eh-color); text-transform:none;
}
.echo-section.is-open .echo-head .n{ color:var(--eh-color); opacity:.75; }

/* ---- the item row (thumbs when collapsed, cards when expanded) ---- */
.echo-cards{ flex:1 1 auto; min-width:0; }
.echo-cards.ov-1row{ display:flex; flex-wrap:nowrap; gap:var(--et-gap); }
.echo-cards.ov-2row{ display:flex; flex-wrap:wrap; }
.echo-cards.ov-scroll{
  display:grid; grid-auto-flow:column;
  grid-template-rows:repeat(var(--ov-rows), max-content);
  grid-auto-columns:var(--ov-col);
  overflow-x:auto; overflow-y:hidden;
  padding-bottom:6px; scrollbar-width:thin;
}
/* collapsed strips use the thumb gap; expanded grids use the card gap */
.echo-cards.collapsed.ov-2row{ gap:var(--et-gap); }
.echo-cards.collapsed.ov-scroll{ gap:var(--et-gap); }
.echo-cards.expanded.ov-1row{ gap:10px; }
.echo-cards.expanded.ov-2row{ display:flex; flex-wrap:wrap; gap:10px; }
.echo-cards.expanded.ov-scroll{ gap:10px; }

/* ---- collapsed: image-only thumbnails ---- */
.echo-thumb{
  flex:0 0 var(--et-size); width:var(--et-size);
  aspect-ratio:var(--et-ar);
  padding:0; border:none; background:none; cursor:pointer; border-radius:5px;
  overflow:hidden; position:relative;
  transition:transform .12s, box-shadow .15s, outline-color .15s;
}
.echo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.echo-thumb:hover{ transform:translateY(-2px); z-index:2; }
.echo-cards.ov-scroll .echo-thumb, .echo-cards.ov-2row .echo-thumb{ width:auto; }

/* thumbnail style variants (data-ethumb on #grid) */
#grid[data-ethumb="hairline"] .echo-thumb{ box-shadow:0 0 0 1px var(--border); }
#grid[data-ethumb="hairline"] .echo-thumb:hover{ box-shadow:0 0 0 1px var(--brand); }
#grid[data-ethumb="accent"]   .echo-thumb{ box-shadow:0 0 0 1px color-mix(in srgb, var(--eh-color) 55%, transparent); }
#grid[data-ethumb="accent"]   .echo-thumb:hover{ box-shadow:0 0 0 2px var(--eh-color); }
#grid[data-ethumb="soft"]     .echo-thumb{ box-shadow:0 1px 4px var(--shadow); }
#grid[data-ethumb="soft"]     .echo-thumb:hover{ box-shadow:0 3px 9px var(--shadow); }
#grid[data-ethumb="plain"]    .echo-thumb{ box-shadow:none; }
/* default when no attribute set */
#grid:not([data-ethumb]) .echo-thumb{ box-shadow:0 0 0 1px var(--border); }

/* ---- expanded: legible cards (thumb + title + star) ---- */
body.echo-view .echo-cards .card,
body.echo-view .echo-cards .echo-thumb{ animation:none; opacity:1; transform:none; }
body.echo-view .echo-cards.expanded .card{
  width:var(--ec-w); flex:0 0 var(--ec-w); border-radius:9px;
}
body.echo-view .echo-cards.expanded .thumb{
  aspect-ratio:auto; height:var(--ec-th);
}
body.echo-view .echo-cards.expanded .card-body{ padding:5px 7px 7px; }
body.echo-view .echo-cards.expanded .card-title{
  font-size:var(--ec-title-fs); line-height:1.2;
}
body.echo-view .echo-cards.expanded .cfav-star{
  width:1.5rem; height:1.5rem; font-size:.95rem; top:.25rem; right:.25rem;
}

/* ---- expanded header position: top bar (default) vs left column ---- */
#grid[data-eh-pos="top"] .echo-section.is-open{ flex-direction:column; gap:8px; }
#grid[data-eh-pos="top"] .echo-section.is-open .echo-head{
  flex:none; width:100%; flex-direction:row; align-items:baseline; gap:10px;
  padding-bottom:2px; border-bottom:2px solid color-mix(in srgb, var(--eh-color) 30%, transparent);
}
#grid[data-eh-pos="top"] .echo-section.is-open .echo-cards{ width:100%; }

@media (max-width:760px){
  .echo-section{ flex-direction:column; gap:8px; }
  .echo-head{ flex:none; width:100%; flex-direction:row; align-items:baseline; gap:8px; }
  .echo-cards{ width:100%; }
}

</style>


<script>
/* ── search bar: one control row, checklist popouts, tuck on scroll ──────── */
(function sbBuild(){
  var chips = document.getElementById("chips");
  if (!chips) return;
  var all = [].slice.call(chips.querySelectorAll(".chip"));
  if (!all.length) return setTimeout(sbBuild, 120);
  if (document.querySelector(".sb-bar")) return;

  var srcAll=null, srcFav=null, srcRec=null, CATS=[], TAGS=[];
  all.forEach(function(c){
    var t = c.textContent.trim();
    if (t === "All") srcAll = c;
    else if (c.id === "chipStarred") srcFav = c;
    else if (c.id === "chipRecent")  srcRec = c;
    else if (c.classList.contains("is-tag")) TAGS.push(t);
    else CATS.push(t);
  });

  var bar = document.createElement("div"); bar.className = "sb-bar";
  function mk(label, cls){
    var b = document.createElement("button");
    b.type = "button"; b.className = "sb-btn" + (cls ? " " + cls : "");
    b.textContent = label; return b;
  }
  var bAll = mk("All"), bFav = mk("\u2605 Favorites"), bRec = mk("\u2605 Recents");
  bAll.setAttribute("aria-pressed","true");

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" '
            + 'stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg>';

  function makePop(label, items, wide){
    var wrap = document.createElement("div"); wrap.className = "pop-wrap";
    var btn  = mk(label);
    btn.innerHTML = label + ' <span class="n" hidden>0</span><span class="caret"></span>';
    var pop = document.createElement("div");
    pop.className = "pop" + (wide ? " wide" : "");
    pop.innerHTML =
      '<div class="pop-list"></div>' +
      '<input class="pop-find" type="search" placeholder="Find ' + label.toLowerCase() + '\u2026" autocomplete="off">' +
      '<div class="pop-foot"><button type="button" class="clr">Clear</button>' +
      '<button type="button" class="primary app">Apply</button></div>';
    var list = pop.querySelector(".pop-list");
    items.forEach(function(t){
      var l = document.createElement("label"); l.className = "pop-item";
      l.innerHTML = '<input type="checkbox" value="' + String(t).replace(/"/g,"&quot;") + '">'
                  + '<span class="pop-box">' + CHECK + '</span><span class="lbl">' + t + '</span>';
      list.appendChild(l);
    });
    pop.querySelector(".pop-find").addEventListener("input", function(e){
      var q = e.target.value.toLowerCase();
      list.querySelectorAll(".pop-item").forEach(function(it){
        it.style.display = it.querySelector(".lbl").textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none";
      });
    });
    btn.onclick = function(e){
      e.stopPropagation();
      document.querySelectorAll(".pop.open").forEach(function(o){ if (o !== pop) o.classList.remove("open"); });
      pop.classList.toggle("open");
    };
    document.addEventListener("click", function(e){ if (!wrap.contains(e.target)) pop.classList.remove("open"); });
    pop.querySelector(".app").onclick = function(){ pop.classList.remove("open"); applyPicks(); };
    pop.querySelector(".clr").onclick = function(){
      pop.querySelectorAll("input:checked").forEach(function(i){ i.checked = false; }); applyPicks();
    };
    wrap.appendChild(btn); wrap.appendChild(pop);
    wrap._picked = function(){
      return [].slice.call(pop.querySelectorAll("input:checked")).map(function(i){ return i.value; });
    };
    wrap._badge = btn.querySelector(".n"); wrap._btn = btn; wrap._pop = pop;
    return wrap;
  }

  var catPop = makePop("Categories", CATS, true);
  var tagPop = makePop("Tags", TAGS, true);
  catPop._pop.style.setProperty("--pop-cols", "var(--pop-cols-cat)");

  function clearPicks(){
    [catPop, tagPop].forEach(function(w){
      w._pop.querySelectorAll("input:checked").forEach(function(i){ i.checked = false; });
    });
  }
  /* within a group: OR.  across the two groups: AND. */
  function applyPicks(){
    var cats = catPop._picked(), tags = tagPop._picked();
    [[catPop, cats], [tagPop, tags]].forEach(function(p){
      p[0]._badge.hidden = p[1].length === 0;
      p[0]._badge.textContent = p[1].length;
      p[0]._btn.classList.toggle("has-picks", p[1].length > 0);
    });
    if (cats.length || tags.length){
      [bAll, bFav, bRec].forEach(function(x){ x.setAttribute("aria-pressed","false"); });
    }
    var meta = {};
    (typeof IMAGES !== "undefined" ? IMAGES : []).forEach(function(im){
      meta[im.title] = { cat: String(im.cat || ""), tags: String(im.tags || "") };
    });
    document.querySelectorAll("#grid .card, #grid .echo-thumb").forEach(function(card){
      var t = card.querySelector(".card-title");
      var title = card.getAttribute("data-echo-title") || (t ? t.textContent.trim() : "");
      var m = meta[title] || null;
      var okC = !cats.length || (m && cats.indexOf(m.cat) >= 0);
      var okT = !tags.length || (m && tags.some(function(x){ return m.tags.indexOf(x) >= 0; }));
      card.style.display = (okC && okT) ? "" : "none";
    });
    if (window.EchoMode && EchoMode.collapse) EchoMode.collapse();
  }

  function proxy(btn, src){
    btn.onclick = function(){
      [bAll, bFav, bRec].forEach(function(x){ x.setAttribute("aria-pressed","false"); });
      btn.setAttribute("aria-pressed","true");
      clearPicks();
      if (src) src.click();
      applyPicks();
    };
  }
  proxy(bAll, srcAll); proxy(bFav, srcFav); proxy(bRec, srcRec);

  var echo = mk("Echo reader");
  echo.title = "Group echo images into a reading protocol";
  echo.setAttribute("aria-pressed","false");
  function setEcho(on){
    echo.setAttribute("aria-pressed", on ? "true" : "false");
    if (on){
      bFav.setAttribute("aria-pressed","false");
      bRec.setAttribute("aria-pressed","false");
      bAll.setAttribute("aria-pressed","true");
      clearPicks();
      if (window.EchoMode) EchoMode.enable();
      if (srcAll) srcAll.click();
    } else {
      if (window.EchoMode) EchoMode.disable();
    }
    applyPicks();
  }
  echo.onclick = function(){ setEcho(echo.getAttribute("aria-pressed") !== "true"); };
  if (window.EchoMode && EchoMode.restore && EchoMode.restore()) setEcho(true);

  var s1 = document.createElement("span"); s1.className = "sb-sep";
  var s2 = document.createElement("span"); s2.className = "sb-sep";
  [bAll, bFav, bRec, s1, catPop, tagPop, s2, echo].forEach(function(el){ bar.appendChild(el); });
  chips.parentNode.insertBefore(bar, chips.nextSibling);

  /* the page re-renders the grid on search / filter, so re-apply after it does */
  var grid = document.getElementById("grid");
  if (grid) new MutationObserver(function(){ applyPicks(); }).observe(grid, { childList:true });

  /* mode chips only exist when signed in; mirror that on our buttons */
  function syncModes(){
    bFav.style.display = (srcFav && srcFav.hidden) ? "none" : "";
    bRec.style.display = (srcRec && srcRec.hidden) ? "none" : "";
  }
  syncModes();
  new MutationObserver(syncModes).observe(chips, { attributes:true, subtree:true, attributeFilter:["hidden"] });
})();

/* tuck the bar on the way down, bring it back on the way up */
(function sbTuck(){
  var last = window.scrollY, bar = null, threshold = 90;
  window.addEventListener("scroll", function(){
    bar = bar || document.querySelector(".controls");
    if (!bar) return;
    var y = window.scrollY, down = y > last;
    if (y > threshold && down) bar.classList.add("is-tucked");
    else if (!down) bar.classList.remove("is-tucked");
    last = y;
  }, { passive:true });
})();
</script>

</body>
