<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reference Image Library · Collatera</title>
<meta name="description" content="A personal clinical reference image library.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<!-- Search + filter chips (the shared header/banner are injected by site.js above) -->
<div class="controls">
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" class="search-input" type="search" placeholder="Search titles, notes, tags…" autocomplete="off" aria-label="Search the library">
  </div>
  <div class="chips" id="chips" role="tablist" aria-label="Filter by category or tag"></div>
</div>

<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <strong>Nothing found</strong>
    Try a different word, or pick a different category or tag above.
  </div>
</main>

<footer>collatera.org &middot; a growing resource for physician innovators &middot; est. 2026</footer>

<!-- ---------- Lightbox markup ---------- -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <button class="lb-close" id="lbClose" aria-label="Close">&#10005;</button>
  <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&#8249;</button>
  <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&#8250;</button>
  <div class="lb-panel">
    <div class="lb-imgwrap"><img id="lbImg" src="" alt=""></div>
    <div class="lb-meta">
      <div class="lb-tagrow" id="lbTagRow"></div>
      <div class="lb-title" id="lbTitle"></div>
      <div class="lb-note" id="lbNote"></div>
    </div>
  </div>
</div>

<!-- shared header / nav / banner -->
<script>window.COLLATERA_SECTION = "Reference Image Library";</script>
<script src="/assets/site.js"></script>

<script>
/* =================================================================
   ====   YOUR LIBRARY LIVES HERE  —  THIS IS THE ONLY PART     ====
   ====   YOU NEED TO EDIT TO ADD OR CHANGE IMAGES.             ====
   =================================================================

   Each image has:
     file:  "/images/your-file.jpg"   the picture, kept in the /images
                                       folder at the top of your repo
     title: "What it's called"         shown under the thumbnail
     cat:   "Echo"                     ONE primary category (must match
                                       a name in CATEGORIES below)
     tags:  ["AV", "LV"]               ANY number of cross-cutting tags;
                                       one tag can appear across several
                                       categories (e.g. AV in Echo AND Valves)
     note:  "A short description."     optional — shows only when the
                                       image is opened, not on the thumbnail

   Categories appear as the first group of filter chips; tags appear
   after the divider. Clicking either filters across the whole library.

   NOTE: the entries below are placeholders so you can see the layout.
   Your 108 real entries (generated from your Excel) replace this block.
   ================================================================= */

let CATEGORIES = [];
let IMAGES = [];
let ALL_TAGS = [];

const catColors = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const colorFor = (cat) => {
  const i = CATEGORIES.indexOf(cat);
  return i >= 0 ? catColors[i % catColors.length] : "var(--border)";
};
  
const grid    = document.getElementById("grid");
const chipsEl = document.getElementById("chips");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const searchEl= document.getElementById("search");

let activeFilter = { type: "all", value: null };  // single-select
let query = "";
let visible = [];

/* ----- build the unified chip row: All · categories · | · tags ----- */
function chipButton(label, type, value, isTag) {
  const b = document.createElement("button");
  b.className = "chip" + (isTag ? " is-tag" : "");
  b.textContent = label;
  b.setAttribute("role","tab");
  const pressed = activeFilter.type === type && activeFilter.value === value;
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.onclick = () => {
    activeFilter = { type, value };
    [...chipsEl.querySelectorAll(".chip")].forEach(c => c.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    render();
  };
  return b;
}
function buildChips() {
  chipsEl.appendChild(chipButton("All", "all", null, false));
  // account-based modes (shown only when signed in)
  const starred = chipButton("Starred", "starred", null, false);
  starred.classList.add("is-mode"); starred.classList.remove("is-tag"); starred.id = "chipStarred";
  const recent = chipButton("Recently viewed", "recentviewed", null, false);
  recent.classList.add("is-mode"); recent.classList.remove("is-tag"); recent.id = "chipRecent";
  chipsEl.appendChild(starred); chipsEl.appendChild(recent);
  updateModeChips();
  const sep0 = document.createElement("span"); sep0.className = "chip-sep"; sep0.setAttribute("aria-hidden","true");
  chipsEl.appendChild(sep0);
  CATEGORIES.forEach(cat => chipsEl.appendChild(chipButton(cat, "cat", cat, false)));
  if (ALL_TAGS.length) {
    const sep = document.createElement("span");
    sep.className = "chip-sep"; sep.setAttribute("aria-hidden","true");
    chipsEl.appendChild(sep);
    ALL_TAGS.forEach(tag => chipsEl.appendChild(chipButton(tag, "tag", tag, true)));
  }
}

/* ----- render the gallery ----- */
function matchesFilter(img) {
  if (activeFilter.type === "all") return true;
  if (activeFilter.type === "cat") return img.cat === activeFilter.value;
  if (activeFilter.type === "tag") return (img.tags || []).includes(activeFilter.value);
  if (activeFilter.type === "starred") return FAVES.has(img.id);
  if (activeFilter.type === "recentviewed") return RECENTS.has(img.id);
  return true;
}
function render() {
  const q = query.trim().toLowerCase();
  const mode = activeFilter.type;

  visible = IMAGES.filter(img => {
    if (!matchesFilter(img)) return false;
    const hay = (img.title + " " + img.cat + " " + (img.note||"") + " " + (img.tags||[]).join(" ")).toLowerCase();
    if (q && !hay.includes(q)) return false;
    return true;
  });

  // Tiered ordering for signed-in users: starred first, then recently
  // viewed within RECENT_WINDOW_DAYS (newest first), then everything else
  // in library order. The "Recently viewed" chip sorts purely by recency.
  if (mode === "recentviewed") {
    visible.sort((a,b) => (RECENTS.get(b.id)||0) - (RECENTS.get(a.id)||0));
  } else if (ME) {
    const cutoff = Date.now() - RECENT_WINDOW_DAYS * 86400000;
    const tier = (im) => {
      if (FAVES.has(im.id)) return 0;
      const t = RECENTS.get(im.id) || 0;
      return t >= cutoff ? 1 : 2;
    };
    visible = visible
      .map((im, i) => ({ im, i, t: tier(im) }))
      .sort((a,b) => {
        if (a.t !== b.t) return a.t - b.t;
        // within the recent tier, newest first; other tiers keep library order
        if (a.t === 1) return (RECENTS.get(b.im.id)||0) - (RECENTS.get(a.im.id)||0);
        return a.i - b.i;
      })
      .map(x => x.im);
  }

  grid.innerHTML = "";
  visible.forEach((img, i) => {
    const card = document.createElement("button");
    card.className = "card";
    card.style.setProperty("--cat", colorFor(img.cat));
    card.style.animationDelay = (Math.min(i, 18) * 0.03) + "s";
    card.onclick = () => openLightbox(i);
    card.innerHTML = `
      <img class="thumb" src="${encodeURI(img.file)}" alt="${img.title}" loading="lazy"
           onerror="this.style.opacity=.4;this.alt='Image not found \u2014 check the file name';">
      <div class="card-body">
        <span class="card-cat" style="background:${colorFor(img.cat)}">${img.cat}</span>
        <span class="card-title">${img.title}</span>
      </div>`;
    if (ME) card.appendChild(makeStar(img));
    grid.appendChild(card);
  });

  const n = visible.length;
  let label = `${n} ${n === 1 ? "image" : "images"}`;
  if (activeFilter.type === "cat") label += ` in ${activeFilter.value}`;
  if (activeFilter.type === "tag") label += ` tagged #${activeFilter.value}`;
  if (mode === "starred") label += ` \u00b7 starred`;
  if (mode === "recentviewed") label += ` \u00b7 recently viewed`;
  if (q) label += ` matching \u201c${query.trim()}\u201d`;
  countEl.textContent = label;
  emptyEl.style.display = n ? "none" : "block";
  grid.style.display = n ? "grid" : "none";
}

/* ----- lightbox (title, category, tags, note all appear here) ----- */
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbTitle = document.getElementById("lbTitle");
const lbNote = document.getElementById("lbNote");
const lbTagRow = document.getElementById("lbTagRow");
let lbIndex = 0;

function openLightbox(i) {
  lbIndex = i; showLb();
  const img = visible[lbIndex];
  if (img) CollateraViews.record(img.file);
  lb.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("lbClose").focus();
}
function showLb() {
  const img = visible[lbIndex];
  if (!img) return;
  lbImg.src = encodeURI(img.file); lbImg.alt = img.title;
  lbTitle.textContent = img.title;
  lbNote.textContent = img.note || "[placeholder — captions under development]";
  lbTagRow.innerHTML =
    `<span class="lb-cat" style="background:${colorFor(img.cat)}">${img.cat}</span>` +
    (img.tags||[]).map(t => `<span class="lb-tag">${t}</span>`).join("");
}
function closeLb() { lb.classList.remove("open"); document.body.style.overflow = ""; }
function step(d) { lbIndex = (lbIndex + d + visible.length) % visible.length; showLb(); }
document.getElementById("lbClose").onclick = closeLb;
document.getElementById("lbPrev").onclick = () => step(-1);
document.getElementById("lbNext").onclick = () => step(1);
lb.onclick = (e) => { if (e.target === lb) closeLb(); };
document.addEventListener("keydown", (e) => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* ----- search ----- */
searchEl.addEventListener("input", (e) => { query = e.target.value; render(); });

/* ----- load the library from images.json, then go ----- */
fetch("/data/images.json")
  .then(r => {
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  })
  .then(data => {
    CATEGORIES = data.categories || [];
    IMAGES = data.images || [];
    ALL_TAGS = [...new Set(IMAGES.flatMap(img => img.tags || []))].sort((a,b)=>a.localeCompare(b));
    buildChips();
    render();
  })
  .catch(err => {
    grid.style.display = "none";
    emptyEl.style.display = "block";
    emptyEl.innerHTML = `<strong>Couldn't load the image library</strong><br>Check that /data/images.json exists at the repo root and is valid JSON.<br><span style="opacity:.7">${err.message}</span>`;
  });
  /* =================================================================
   FAVORITES  (per-user, requires login) — 7a-ii
   Adds a star to each card (signed-in only). Starring writes a row
   to the RLS-protected `favorites` table; starred items float to the
   front on the next render. Logged out, none of this appears.
   Relies on window.sb / window.sbReady from site.js.
   ================================================================= */
let FAVES = new Set();   // item_ids the signed-in user has starred (source=image)
let ME    = null;        // signed-in user's id, or null when logged out

(function injectFavCss(){
  const s = document.createElement("style");
  s.textContent = `
    .card{position:relative}
    .cfav-star{position:absolute;top:.4rem;right:.4rem;z-index:2;
      width:1.9rem;height:1.9rem;display:flex;align-items:center;justify-content:center;
      font-size:1.15rem;line-height:1;border-radius:50%;cursor:pointer;border:none;
      background:rgba(0,0,0,.34);color:#fff;transition:transform .1s ease, background .15s}
    .cfav-star:hover{transform:scale(1.12);background:rgba(0,0,0,.52)}
    .cfav-star.is-on{color:#FFD24A}
    .cfav-star:focus-visible{outline:2px solid var(--accent,#85CCCC);outline-offset:2px}
  `;
  document.head.appendChild(s);
})();

function setStar(s, on){
  s.classList.toggle("is-on", on);
  s.textContent = on ? "\u2605" : "\u2606";       // ★ / ☆
  s.setAttribute("aria-pressed", on ? "true" : "false");
  s.setAttribute("aria-label", on ? "Remove from favorites" : "Add to favorites");
}

function makeStar(img){
  const on = FAVES.has(img.id);
  const s = document.createElement("span");
  s.className = "cfav-star";
  s.dataset.cfavId = img.id;
  s.setAttribute("role", "button");
  s.setAttribute("tabindex", "0");
  setStar(s, on);
  const activate = (e) => { e.preventDefault(); e.stopPropagation(); toggleFav(img.id); };
  s.addEventListener("click", activate);
  s.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") activate(e); });
  return s;
}

async function toggleFav(id){
  if (!ME || !window.sb) return;
  const wasOn = FAVES.has(id);
  // optimistic: flip every star for this item, reconcile with the server
  if (wasOn) FAVES.delete(id); else FAVES.add(id);
  syncStars(id);
  let error;
  if (wasOn) {
    ({ error } = await window.sb.from("favorites").delete()
        .eq("item_id", id).eq("source", "image"));
  } else {
    ({ error } = await window.sb.from("favorites")
        .upsert({ user_id: ME, item_id: id, source: "image" }, { onConflict: "user_id,item_id" }));
  }
  if (error) {
    if (wasOn) FAVES.add(id); else FAVES.delete(id);
    syncStars(id);
    console.warn("favorite toggle failed:", error.message);
  }
}

async function loadFaves(){
  const sb = await window.sbReady;
  const { data: { session } } = await sb.auth.getSession();
  ME = session?.user?.id || null;
  FAVES = new Set();
  if (ME) {
    const { data, error } = await sb.from("favorites").select("item_id").eq("source", "image");
    if (!error && data) for (const row of data) FAVES.add(row.item_id);
  }
}

(function initUser(){
  if (!window.sbReady) { setTimeout(initUser, 50); return; }   // wait for site.js
  window.sbReady.then(async (sb) => {
    await loadFaves(); await loadRecents(); updateModeChips(); render();
    sb.auth.onAuthStateChange(async () => {
      await loadFaves(); await loadRecents(); updateModeChips(); render();
    });
  });
})();


/* =================================================================
   RECENTS + mode-chip visibility — account-based "Recently viewed".
   Records each image open into recent_views, loads a user's recents,
   and shows/hides the Starred & Recently-viewed chips with login state.
   ================================================================= */
let RECENTS = new Map();   // item_id -> viewed_at (ms) for the signed-in user

async function loadRecents(){
  RECENTS = new Map();
  if (!ME || !window.sb) return;
  const { data, error } = await window.sb.from("recent_views")
    .select("item_id, viewed_at").eq("source", "image");
  if (!error && data) for (const row of data) RECENTS.set(row.item_id, new Date(row.viewed_at).getTime());
}

async function recordView(img){
  if (!ME || !window.sb || !img) return;
  RECENTS.set(img.id, Date.now());
  const { error } = await window.sb.from("recent_views")
    .upsert({ user_id: ME, item_id: img.id, source: "image", viewed_at: new Date().toISOString() },
            { onConflict: "user_id,item_id" });
  if (error) console.warn("recordView failed:", error.message);
}

function updateModeChips(){
  const show = !!ME;
  const cs = document.getElementById("chipStarred");
  const cr = document.getElementById("chipRecent");
  if (cs) cs.style.display = show ? "" : "none";
  if (cr) cr.style.display = show ? "" : "none";
  if (!show && (activeFilter.type === "starred" || activeFilter.type === "recentviewed")) {
    activeFilter = { type: "all", value: null };
    const chips = [...chipsEl.querySelectorAll(".chip")];
    chips.forEach(c => c.setAttribute("aria-pressed","false"));
    if (chips[0]) chips[0].setAttribute("aria-pressed","true");
  }
}

/* record each image open to the account (local tracker still runs too) */
(function patchOpenForRecents(){
  const _origOpen = openLightbox;
  openLightbox = function(i){ _origOpen(i); recordView(visible[i]); };
})();



/* =================================================================
   TIERED ORDERING SUPPORT + lightbox star
   RECENT_WINDOW_DAYS controls how long a viewed image keeps floating.
   syncStars keeps the card star and the lightbox star in agreement.
   ================================================================= */
const RECENT_WINDOW_DAYS = 14;

function syncStars(id){
  document.querySelectorAll('.cfav-star[data-cfav-id="' + id + '"]')
    .forEach(el => setStar(el, FAVES.has(id)));
}

(function lbStarStyle(){
  const s = document.createElement("style");
  s.textContent = `
    .cfav-lbstar{position:static;display:inline-flex;vertical-align:middle;
      margin-right:.5rem;width:1.6rem;height:1.6rem;font-size:1.3rem;
      background:transparent;color:inherit}
    .cfav-lbstar:hover{background:var(--accent-tint,#E7F4F4);transform:scale(1.1)}
    .cfav-lbstar.is-on{color:#E8A200}
  `;
  document.head.appendChild(s);
})();

(function addLightboxStar(){
  const lbTitleEl = document.getElementById("lbTitle");
  if (!lbTitleEl) return;
  const st = document.createElement("span");
  st.className = "cfav-star cfav-lbstar";
  st.setAttribute("role", "button");
  st.setAttribute("tabindex", "0");
  st.hidden = true;
  lbTitleEl.insertAdjacentElement("beforebegin", st);

  const activate = (e) => {
    e.preventDefault(); e.stopPropagation();
    const id = st.dataset.cfavId;
    if (id) toggleFav(id);
  };
  st.addEventListener("click", activate);
  st.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") activate(e); });

  const _origShowLb = showLb;
  showLb = function(){
    _origShowLb();
    const img = visible[lbIndex];
    if (ME && img) { st.hidden = false; st.dataset.cfavId = img.id; setStar(st, FAVES.has(img.id)); }
    else { st.hidden = true; }
  };
})();

/* profile panel cleared the history -> drop it locally and re-render */
document.addEventListener("collatera:recents-cleared", () => {
  RECENTS = new Map();
  if (activeFilter.type === "recentviewed") activeFilter = { type: "all", value: null };
  render();
});

</script>
</body>
</html>
