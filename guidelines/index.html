<script>
/* =================================================================
   ====   YOUR GUIDELINE CATALOG  —  generated from your Excel.    ====
   ====   To add or edit entries, edit the GUIDELINES list below.  ====
   ====   Each entry: topic (title), year, societies [list], url.  ====
   ====   SOCIETIES and TOPICS become the filter chips; a society  ====
   ====   chip matches any entry that lists it (joint guidelines   ====
   ====   show under each of their societies). REPOSITORIES are    ====
   ====   the pinned links under the filter.                       ====
   ================================================================= */

const SOCIETIES = ["ACC", "AHA", "ESC", "HRS", "SCAI", "HFSA", "CHEST"];
const TOPICS = ["ACHD", "ACS", "Acute PE", "AF", "Aorta", "CAD", "Chest Pain", "CKMS", "Endocarditis", "HCM", "HF", "HLD", "HTN", "PCI", "Peri-Op", "PH", "Pregnancy", "Prevention", "SVT", "Syncope", "Valve", "VT/VF"];
const REPOSITORIES = [{"label": "JACC", "url": "https://www.jacc.org/guidelines"}, {"label": "ACC", "url": "https://www.acc.org/guidelines"}, {"label": "ESC", "url": "https://www.escardio.org/guidelines/clinical-practice-guidelines/all-esc-practice-guidelines/"}, {"label": "JCS", "url": "https://www.j-circ.or.jp/english/cj/jcs-guidelines/"}];
const GUIDELINES = [
  {"id": "gl_sv4i6h5z", "topic": "Acute PE", "year": 2026, "societies": ["ACC", "AHA"], "url": "https://www.jacc.org/guidelines/acute-pulmonary-embolism"},

  {"id": "gl_yu1rapb2", "topic": "ACS", "year": 2023, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article/41/1/111/5556353"},
  {"id": "gl_04rpm4en", "topic": "AF", "year": 2023, "societies": ["ACC", "AHA", "HRS"], "url": "https://www.jacc.org/guidelines/atrial-fibrillation"},
  {"id": "gl_tmjc0gfs", "topic": "CAD", "year": 2023, "societies": ["AHA", "ACC"], "url": "https://www.jacc.org/guidelines/chronic-coronary-disease"},
  {"id": "gl_pl4t8sno", "topic": "HF", "year": 2023, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article/44/37/3627/7246292"},
  {"id": "gl_ecqrzii9", "topic": "Endocarditis", "year": 2023, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article/44/39/3948/7243107?login=false"},
  {"id": "gl_18vpf3s4", "topic": "Peri-Op", "year": 2022, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article/43/39/3826/6675076"},
  {"id": "gl_c1293ybs", "topic": "Aorta", "year": 2022, "societies": ["ACC", "AHA"], "url": "https://www.jacc.org/guidelines/aortic-disease"},
  {"id": "gl_e11h4uy5", "topic": "HF", "year": 2022, "societies": ["AHA", "ACC", "HFSA"], "url": "https://www.jacc.org/guidelines/heart-failure-management"},
  {"id": "gl_va63ukm8", "topic": "PH", "year": 2022, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article/43/38/3618/6673929?login=false"},
  {"id": "gl_x7eyuw4p", "topic": "Chest Pain", "year": 2021, "societies": ["AHA", "ACC", "CHEST"], "url": "https://www.jacc.org/guidelines/chest-pain"},
  {"id": "gl_ambprwih", "topic": "PCI", "year": 2021, "societies": ["ACC", "AHA", "SCAI"], "url": "https://www.jacc.org/guidelines/revascularization"},
  {"id": "gl_am254uz9", "topic": "Prevention", "year": 2021, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article/42/34/3227/6358713"},
  {"id": "gl_yp5ny4ns", "topic": "ACHD", "year": 2020, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article/42/6/563/5898606"},
  {"id": "gl_dgnqzh37", "topic": "Valve", "year": 2020, "societies": ["ACC", "AHA"], "url": "https://www.jacc.org/guidelines/vhd"},
  {"id": "gl_gs5ed5jw", "topic": "HLD", "year": 2019, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article/41/1/111/5556353"},
  {"id": "gl_g8tioyjm", "topic": "Prevention", "year": 2019, "societies": ["ACC", "AHA"], "url": "https://www.jacc.org/guidelines/prevention"},
  {"id": "gl_8avcd9f7", "topic": "SVT", "year": 2019, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article/41/5/655/5556821"},
  {"id": "gl_x306ek63", "topic": "PCI", "year": 2018, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article-abstract/40/2/87/5079120?redirectedFrom=fulltext"},
  {"id": "gl_0oxd8aeb", "topic": "Syncope", "year": 2018, "societies": ["ESC"], "url": "https://academic.oup.com/eurheartj/article-abstract/39/21/1883/4939241?redirectedFrom=fulltext"},
  {"id": "gl_hgyli0ob", "topic": "Syncope", "year": 2017, "societies": ["ACC", "AHA", "HRS"], "url": "https://www.jacc.org/doi/pdf/10.1016/j.jacc.2017.03.003"},
  {"id": "gl_kek7lcoh", "topic": "VT/VF", "year": 2017, "societies": ["ACC", "AHA", "HRS"], "url": "https://www.jacc.org/guidelines/VASCD"},
  {"id": "gl_d9o3eezs", "topic": "SVT", "year": 2015, "societies": ["ACC", "AHA", "HRS"], "url": "https://www.jacc.org/doi/pdf/10.1016/j.jacc.2015.08.856"}
];

/* =================================================================
   ====   You normally do NOT need to edit anything below here. ====
   ================================================================= */

const catColors=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const colorFor=(soc)=>{const i=SOCIETIES.indexOf(soc);return i>=0?catColors[i%catColors.length]:"var(--border)";};

const grid=document.getElementById("grid");
const chipsEl=document.getElementById("chips");
const countEl=document.getElementById("count");
const emptyEl=document.getElementById("empty");
const searchEl=document.getElementById("search");
const reposEl=document.getElementById("repos");

let activeFilter={type:"all",value:null};
let query="";

/* pinned repository links */
function buildRepos(){
  if(!REPOSITORIES.length) return;
  reposEl.innerHTML='<span class="repos-label">Full repositories:</span>';
  REPOSITORIES.forEach(r=>{
    const a=document.createElement("a");
    a.className="repo-link"; a.href=r.url; a.target="_blank"; a.rel="noopener";
    a.textContent=r.label; reposEl.appendChild(a);
  });
}

function chipButton(label,type,value,isTag){
  const b=document.createElement("button");
  b.className="chip"+(isTag?" is-tag":""); b.textContent=label;
  b.setAttribute("role","tab");
  const pressed=activeFilter.type===type&&activeFilter.value===value;
  b.setAttribute("aria-pressed",pressed?"true":"false");
  b.onclick=()=>{activeFilter={type,value};
    [...chipsEl.querySelectorAll(".chip")].forEach(c=>c.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true"); render();};
  return b;
}
function buildChips(){
  chipsEl.appendChild(chipButton("All","all",null,false));
  const starred=chipButton("Starred","starred",null,false); starred.classList.add("is-mode"); starred.id="chipStarred";
  const recent=chipButton("Recently viewed","recentviewed",null,false); recent.classList.add("is-mode"); recent.id="chipRecent";
  chipsEl.appendChild(starred); chipsEl.appendChild(recent);
  updateModeChips();
  const sep0=document.createElement("span"); sep0.className="chip-sep"; sep0.setAttribute("aria-hidden","true");
  chipsEl.appendChild(sep0);
  SOCIETIES.forEach(s=>chipsEl.appendChild(chipButton(s,"soc",s,false)));
  if(TOPICS.length){
    const sep=document.createElement("span");sep.className="chip-sep";sep.setAttribute("aria-hidden","true");
    chipsEl.appendChild(sep);
    TOPICS.forEach(t=>chipsEl.appendChild(chipButton(t,"topic",t,true)));
  }
}

function matchesFilter(g){
  if(activeFilter.type==="all")return true;
  if(activeFilter.type==="soc")return g.societies.includes(activeFilter.value);
  if(activeFilter.type==="topic")return g.topic===activeFilter.value;
  if(activeFilter.type==="starred")return FAVES.has(g.id);
  if(activeFilter.type==="recentviewed")return RECENTS.has(g.id);
  return true;
}
function render(){
  const q=query.trim().toLowerCase();
  const mode=activeFilter.type;
  let visible=GUIDELINES.filter(g=>{
    if(!matchesFilter(g))return false;
    const hay=(g.topic+" "+g.societies.join(" ")+" "+g.year).toLowerCase();
    if(q && !hay.includes(q))return false;
    return true;
  });

  const byYear=(a,b)=>(Number(b.year)||0)-(Number(a.year)||0)||a.topic.localeCompare(b.topic);
  if(mode==="recentviewed"){
    visible.sort((a,b)=>(RECENTS.get(b.id)||0)-(RECENTS.get(a.id)||0));
  } else if(ME){
    visible.sort((a,b)=>{
      const ta=cfavTier(a), tb=cfavTier(b);
      if(ta!==tb)return ta-tb;
      if(ta===1)return (RECENTS.get(b.id)||0)-(RECENTS.get(a.id)||0);
      return byYear(a,b);
    });
  } else {
    visible.sort(byYear);
  }

  grid.innerHTML="";
  visible.forEach((g,i)=>{
    const wrap=document.createElement("div");
    wrap.className="cfav-host";
    const a=document.createElement("a");
    a.className="linkcard"; a.href=g.url; a.target="_blank"; a.rel="noopener";
    a.onclick=()=>recordView(g);
    a.style.setProperty("--cat",colorFor(g.societies[0]||""));
    a.style.animationDelay=(Math.min(i,18)*0.03)+"s";
    const socPills=g.societies.map(s=>`<span class="lc-soc" style="background:${colorFor(s)}">${s}</span>`).join("");
    a.innerHTML=`<div class="lc-socrow">${socPills}</div>
      <span class="lc-title">${g.topic}</span>
      <span class="lc-meta">${g.year}</span>`;
    wrap.appendChild(a);
    if(ME) wrap.appendChild(makeStar(g));
    grid.appendChild(wrap);
  });

  const n=visible.length;
  let label=`${n} ${n===1?"guideline":"guidelines"}`;
  if(activeFilter.type==="soc")label+=` from ${activeFilter.value}`;
  if(activeFilter.type==="topic")label+=` on ${activeFilter.value}`;
  if(mode==="starred")label+=` \u00b7 starred`;
  if(mode==="recentviewed")label+=` \u00b7 recently viewed`;
  if(q)label+=` matching \u201c${query.trim()}\u201d`;
  countEl.textContent=label;
  emptyEl.style.display=n?"none":"block";
  grid.style.display=n?"grid":"none";
}



const CFAV_SOURCE = "guideline";

/* =================================================================
   FAVORITES + RECENTS  (per-user, requires login)
   Star each card; starred items lead, then anything opened in the
   last RECENT_WINDOW_DAYS, then the rest. Chips filter explicitly.
   Relies on window.sb / window.sbReady from site.js.
   ================================================================= */
const RECENT_WINDOW_DAYS = 14;
let FAVES = new Set();
let RECENTS = new Map();
let ME = null;

(function injectFavCss(){
  const s = document.createElement("style");
  s.textContent = `
    .cfav-host{position:relative}
    .cfav-star{position:absolute;top:.4rem;right:.4rem;z-index:2;
      width:1.9rem;height:1.9rem;display:flex;align-items:center;justify-content:center;
      font-size:1.15rem;line-height:1;border-radius:50%;cursor:pointer;border:none;
      background:rgba(0,0,0,.34);color:#fff;transition:transform .1s ease, background .15s}
    .cfav-star:hover{transform:scale(1.12);background:rgba(0,0,0,.52)}
    .cfav-star.is-on{color:#FFD24A}
    .cfav-star:focus-visible{outline:2px solid var(--accent,#85CCCC);outline-offset:2px}
  `;
  document.head.appendChild(s);
})();

function setStar(s, on){
  s.classList.toggle("is-on", on);
  s.textContent = on ? "\u2605" : "\u2606";
  s.setAttribute("aria-pressed", on ? "true" : "false");
  s.setAttribute("aria-label", on ? "Remove from favorites" : "Add to favorites");
}
function syncStars(id){
  document.querySelectorAll('.cfav-star[data-cfav-id="' + id + '"]')
    .forEach(el => setStar(el, FAVES.has(id)));
}
function makeStar(item){
  const s = document.createElement("span");
  s.className = "cfav-star";
  s.dataset.cfavId = item.id;
  s.setAttribute("role","button");
  s.setAttribute("tabindex","0");
  setStar(s, FAVES.has(item.id));
  const activate = (e) => { e.preventDefault(); e.stopPropagation(); toggleFav(item.id); };
  s.addEventListener("click", activate);
  s.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") activate(e); });
  return s;
}

async function toggleFav(id){
  if (!ME || !window.sb) return;
  const wasOn = FAVES.has(id);
  if (wasOn) FAVES.delete(id); else FAVES.add(id);
  syncStars(id);
  let error;
  if (wasOn) {
    ({ error } = await window.sb.from("favorites").delete()
        .eq("item_id", id).eq("source", CFAV_SOURCE));
  } else {
    ({ error } = await window.sb.from("favorites")
        .upsert({ user_id: ME, item_id: id, source: CFAV_SOURCE }, { onConflict: "user_id,item_id" }));
  }
  if (error) {
    if (wasOn) FAVES.add(id); else FAVES.delete(id);
    syncStars(id);
    console.warn("favorite toggle failed:", error.message);
  }
}

async function recordView(item){
  if (!ME || !window.sb || !item) return;
  RECENTS.set(item.id, Date.now());
  const { error } = await window.sb.from("recent_views")
    .upsert({ user_id: ME, item_id: item.id, source: CFAV_SOURCE, viewed_at: new Date().toISOString() },
            { onConflict: "user_id,item_id" });
  if (error) console.warn("recordView failed:", error.message);
}

async function loadUserData(){
  const sb = await window.sbReady;
  const { data: { session } } = await sb.auth.getSession();
  ME = session?.user?.id || null;
  FAVES = new Set(); RECENTS = new Map();
  if (!ME) return;
  const [f, r] = await Promise.all([
    sb.from("favorites").select("item_id").eq("source", CFAV_SOURCE),
    sb.from("recent_views").select("item_id, viewed_at").eq("source", CFAV_SOURCE)
  ]);
  if (!f.error && f.data) for (const row of f.data) FAVES.add(row.item_id);
  if (!r.error && r.data) for (const row of r.data) RECENTS.set(row.item_id, new Date(row.viewed_at).getTime());
}

/* tier: 0 starred, 1 recent (within window), 2 everything else */
function cfavTier(item){
  if (!ME) return 2;
  if (FAVES.has(item.id)) return 0;
  const t = RECENTS.get(item.id) || 0;
  return t >= (Date.now() - RECENT_WINDOW_DAYS * 86400000) ? 1 : 2;
}

function updateModeChips(){
  const show = !!ME;
  const cs = document.getElementById("chipStarred");
  const cr = document.getElementById("chipRecent");
  if (cs) cs.style.display = show ? "" : "none";
  if (cr) cr.style.display = show ? "" : "none";
}

document.addEventListener("collatera:recents-cleared", () => { RECENTS = new Map(); render(); });

(function initUser(){
  if (!window.sbReady) { setTimeout(initUser, 50); return; }
  window.sbReady.then(async (sb) => {
    await loadUserData(); updateModeChips(); render();
    sb.auth.onAuthStateChange(async () => { await loadUserData(); updateModeChips(); render(); });
  });
})();


/* bootstrap last: the shared favorites block above must be
   initialised before buildChips()/render() reference it */
searchEl.addEventListener("input",(e)=>{query=e.target.value;render();});
buildRepos(); buildChips(); render();
</script>

<style>
/* ============================================================
   Reference library — page-local background (rf- prefix, no global clash)
   Tiled topographic texture across the page, with ONE shading element:
   constant fill through the core, feathering to nothing across a defined
   band so the outer margins keep the texture at full strength.
   ============================================================ */

body{ position:relative; background:var(--bg); }

.rf-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:var(--rf-tile);
  background-repeat:repeat; background-size:var(--rf-texsize) auto; background-position:center;
  opacity:var(--rf-texop); filter:var(--rf-coral, none);
}

.rf-wash{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:var(--rf-pad); opacity:var(--rf-wash);
}

.rf-slab{
  position:absolute; z-index:0; pointer-events:none;
  left:50%; transform:translateX(-50%);
  width:calc(var(--rf-core) + 2 * var(--rf-band));
  top:calc(var(--rf-top) - var(--rf-band));
  height:calc(100% - var(--rf-top) - var(--rf-bot) + 2 * var(--rf-band));
  background:var(--rf-pad);
  opacity:var(--rf-op);
  border-radius:var(--rf-round);
  -webkit-mask-image:
    linear-gradient(to right, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    linear-gradient(to right, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%);
  mask-composite:intersect;
}

/* page content sits above both layers */
.controls, main, footer{ position:relative; z-index:1; }

/* one frame without the filter on a theme swap, so the composited layer is
   discarded and repaints in the new palette instead of the previous one */
:root.theme-swap .rf-slab, :root.theme-swap .rf-wash{ opacity:0; }

/* ---- page-local tokens (light / dark / auto, mirroring the site) ---- */
:root{
  --rf-tile:url("/assets/collatera-tile-coral.png");
  --rf-coral:saturate(1.52) brightness(0.85) contrast(1.09);
  --rf-pad:#FFFDF8;
  --rf-texop:.55; --rf-texsize:570px; --rf-wash:.73;
  --rf-core:1220px; --rf-band:65px; --rf-op:.62;
  --rf-top:0px; --rf-bot:115px; --rf-round:30px;
}
:root[data-theme="dark"]{
  --rf-tile:url("/assets/collatera-tile-blue.png"); --rf-coral:none;
  --rf-pad:#141C22;
  --rf-texop:.19; --rf-texsize:570px; --rf-wash:0;
  --rf-core:1300px; --rf-band:65px; --rf-op:.80;
  --rf-top:0px; --rf-bot:115px; --rf-round:30px;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
  --rf-tile:url("/assets/collatera-tile-blue.png"); --rf-coral:none;
    --rf-pad:#141C22;
    --rf-texop:.19; --rf-texsize:570px; --rf-wash:0;
    --rf-core:1300px; --rf-band:65px; --rf-op:.80;
    --rf-top:0px; --rf-bot:115px; --rf-round:30px;
  }
}

/* ---- narrow screens: shrink the core so the band still reads ---- */
@media (max-width:1380px){
  :root, :root[data-theme="dark"]{ --rf-core:min(1300px, calc(100vw - 130px)); }
}
@media (max-width:760px){
  :root, :root[data-theme="dark"]{ --rf-core:calc(100vw - 44px); --rf-band:22px; --rf-round:18px; }
}
/* ============================================================
   Sticky search bar (sb- prefix, page-local)
   One control row: All / Favorites / Recents / Categories / Tags / Echo.
   Sits above the header in stacking order so the header's soft lower edge
   never dims it, and tucks away when scrolling down.
   ============================================================ */
.controls{
  position:sticky; top:var(--sb-top); z-index:60;
  max-width:var(--sb-w); margin:14px auto 6px;
  border-radius:var(--sb-round); padding:var(--sb-pad) 14px;
  border:var(--sb-bw) solid var(--sb-border);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
          backdrop-filter:blur(16px) saturate(140%);
  /* diagonal fade: solid at the top-left, pattern gathering bottom-right */
  background:
    linear-gradient(135deg,
      var(--sb-bg) 0%,
      var(--sb-bg) var(--tile-start),
      color-mix(in srgb, var(--sb-bg) calc(var(--tile-mid) * 100%), transparent) var(--tile-end),
      color-mix(in srgb, var(--sb-bg) calc(var(--tile-low) * 100%), transparent) 100%),
    var(--rf-tile, none);
  background-size:auto, 410px auto;
  background-repeat:no-repeat, repeat;
  background-position:0 0, bottom right;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  transition:transform .28s cubic-bezier(.22,.61,.36,1), opacity .2s;
}
.controls.is-tucked{
  transform:translateY(calc(-100% - var(--sb-top) - 18px));
  opacity:0; pointer-events:none;
}
:root{
  --sb-top:90px; --sb-w:890px; --sb-round:13px; --sb-pad:9px; --sb-bw:2px;
  --sb-bg:var(--bg); --sb-border:var(--border);
  --sb-fs:12px; --sb-py:5px; --sb-px:10px; --sb-gap:6px;
  --sb-search-h:34px; --sb-stack:9px; --sb-rowgap:4px;
  --pop-w:320px; --pop-wide:490px; --pop-cols:5; --pop-cols-cat:3;
  --tile-start:0%; --tile-end:40%; --tile-mid:.70; --tile-low:0; --sb-glow:3px;
}
:root[data-theme="dark"]{
  --tile-start:44%; --tile-end:84%; --tile-mid:.39; --tile-low:.80; --sb-glow:6px;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --tile-start:44%; --tile-end:84%; --tile-mid:.39; --tile-low:.80; --sb-glow:6px;
  }
}
:root.theme-swap .controls{ opacity:0; }

.search-wrap{ margin:0 0 var(--sb-stack) 0 !important; }
.search-input{ height:var(--sb-search-h) !important; font-size:13.5px !important;
  padding-top:0 !important; padding-bottom:0 !important; }

/* ---- the control row ---- */
#chips{ display:none; }
.sb-bar{ display:flex; flex-wrap:wrap; align-items:center;
  gap:var(--sb-rowgap) var(--sb-gap); }
.sb-btn{
  display:inline-flex; align-items:center; gap:6px; position:relative;
  font:inherit; font-size:var(--sb-fs); font-weight:600;
  padding:var(--sb-py) var(--sb-px); border-radius:999px; cursor:pointer;
  border:1px solid color-mix(in srgb, var(--brand) 42%, transparent);
  background:transparent; color:var(--brand); white-space:nowrap;
  transition:background .16s, color .16s, border-color .16s, box-shadow .16s;
}
/* hover previews the selected state */
.sb-btn:hover{
  background:color-mix(in srgb, var(--brand) 16%, transparent);
  border-color:var(--brand); color:var(--brand);
  box-shadow:inset 0 0 12px color-mix(in srgb, var(--brand) 22%, transparent);
}
.sb-btn[aria-pressed="true"], .sb-btn.has-picks{
  background:color-mix(in srgb, var(--brand) 14%, transparent);
  border-color:var(--brand); color:var(--brand);
  box-shadow:inset 0 0 var(--sb-glow) color-mix(in srgb, var(--brand) 34%, transparent);
}
.sb-btn.is-soon{ opacity:.5; cursor:not-allowed; border-style:dashed; }
.sb-btn.is-soon:hover{ background:transparent; box-shadow:none;
  border-color:color-mix(in srgb, var(--brand) 42%, transparent); }
.sb-btn .caret{ width:0; height:0; border-left:4px solid transparent;
  border-right:4px solid transparent; border-top:5px solid currentColor; opacity:.75; }
.sb-btn .n{ background:var(--accent-deep); color:#fff; border-radius:999px;
  font-size:10px; padding:0 5px; line-height:15px; }
.sb-sep{ width:1px; align-self:stretch; margin:2px 4px;
  background:color-mix(in srgb, var(--brand) 30%, transparent); }

/* ---- checklist popouts ---- */
.pop-wrap{ position:relative; }
.pop{
  position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
  z-index:90; width:var(--pop-w); max-width:calc(var(--sb-w) - 24px);
  border-radius:14px; overflow:hidden; display:none;
  background:var(--surface);
  border:1px solid color-mix(in srgb, var(--brand) 40%, transparent);
  box-shadow:0 20px 50px rgba(0,0,0,.42);
}
.pop.open{ display:block; animation:sbPop .14s ease-out; }
@keyframes sbPop{ from{ opacity:0; transform:translateX(-50%) translateY(-6px) scale(.985); }
                  to{ opacity:1; transform:translateX(-50%); } }
.pop.wide{ width:var(--pop-wide); }
.pop-list{ padding:9px 9px 5px; display:grid; gap:1px 6px;
  grid-template-columns:repeat(var(--pop-cols-cat), minmax(0,1fr)); }
.pop.wide .pop-list{ grid-template-columns:repeat(var(--pop-cols), minmax(0,1fr)); }
.pop-item{ display:flex; align-items:center; gap:8px; padding:5px 7px; border-radius:8px;
  font-size:12.5px; color:var(--ink); cursor:pointer; user-select:none; }
.pop-item:hover{ background:color-mix(in srgb, var(--brand) 10%, transparent); }
.pop-item input{ position:absolute; opacity:0; pointer-events:none; }
.pop-box{ width:15px; height:15px; flex:none; border-radius:5px;
  border:1.5px solid color-mix(in srgb, var(--brand) 50%, transparent);
  display:grid; place-items:center; transition:.13s; }
.pop-item input:checked + .pop-box{ background:var(--brand); border-color:var(--brand); }
.pop-box svg{ width:10px; height:10px; opacity:0; transform:scale(.6); transition:.13s; }
.pop-item input:checked + .pop-box svg{ opacity:1; transform:none; }
/* find field sits at the foot, directly above Apply */
.pop-find{ display:block; box-sizing:border-box; width:calc(100% - 18px); margin:4px 9px 0;
  padding:6px 9px; font:inherit; font-size:12.5px; border-radius:8px;
  border:1px solid color-mix(in srgb, var(--brand) 26%, transparent);
  background:color-mix(in srgb, var(--bg) 60%, transparent); color:var(--ink); }
.pop-foot{ display:flex; gap:8px; padding:8px 9px 10px; }
.pop-foot button{ flex:1; padding:7px; border-radius:9px; cursor:pointer; font:inherit;
  font-size:12px; font-weight:600;
  border:1px solid color-mix(in srgb, var(--brand) 40%, transparent);
  background:transparent; color:var(--ink); }
.pop-foot .primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
.pop-foot button:hover{ filter:brightness(1.06); }

@media (max-width:760px){
  :root{ --sb-w:calc(100vw - 20px); --pop-wide:calc(100vw - 40px); --pop-cols:3; --pop-cols-cat:2; }
}


</style>
<script>

(function sbBuild(){
  var chips = document.getElementById("chips");
  if (!chips) return;
  var all = [].slice.call(chips.querySelectorAll(".chip"));
  if (!all.length) return setTimeout(sbBuild, 120);
  if (document.querySelector(".sb-bar")) return;

  var CFG = { g1:"Societies", g2:"Topics", cols1:4, cols2:5, data:"GUIDELINES", dataFn:function(){ return (typeof GUIDELINES!=="undefined")?GUIDELINES:[]; }, titleClass:"lc-title", title:function(r){return r.topic;}, f1:function(r){return r.societies||[];}, f2:function(r){return (r.tags||r.topics||[]).concat([r.topic]);} };
  var srcAll=null, srcFav=null, srcRec=null, G1=[], G2=[];
  all.forEach(function(c){
    var t = c.textContent.trim();
    if (t === "All") srcAll = c;
    else if (c.id === "chipStarred") srcFav = c;
    else if (c.id === "chipRecent")  srcRec = c;
    else if (c.classList.contains("is-tag")) G2.push(t);
    else G1.push(t);
  });

  var bar = document.createElement("div"); bar.className = "sb-bar";
  function mk(label, cls){
    var b = document.createElement("button");
    b.type = "button"; b.className = "sb-btn" + (cls ? " " + cls : "");
    b.textContent = label; return b;
  }
  var bAll = mk("All"); bAll.setAttribute("aria-pressed","true");
  var bFav = srcFav ? mk("\u2605 Favorites") : null;
  var bRec = srcRec ? mk("\u2605 Recents")   : null;

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" '
            + 'stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg>';

  function makePop(label, items, cols){
    var wrap = document.createElement("div"); wrap.className = "pop-wrap";
    var btn  = mk(label);
    btn.innerHTML = label + ' <span class="n" hidden>0</span><span class="caret"></span>';
    var pop = document.createElement("div"); pop.className = "pop wide";
    pop.style.setProperty("--pop-cols", cols);
    pop.innerHTML =
      '<div class="pop-list"></div>' +
      '<input class="pop-find" type="search" placeholder="Find ' + label.toLowerCase() + '\u2026" autocomplete="off">' +
      '<div class="pop-foot"><button type="button" class="clr">Clear</button>' +
      '<button type="button" class="primary app">Apply</button></div>';
    var list = pop.querySelector(".pop-list");
    if (!items.length){
      var e = document.createElement("div");
      e.style.cssText = "padding:14px 10px;font-size:12.5px;opacity:.6;grid-column:1/-1;text-align:center";
      e.textContent = "Nothing here yet";
      list.appendChild(e);
    }
    items.forEach(function(t){
      var l = document.createElement("label"); l.className = "pop-item";
      l.innerHTML = '<input type="checkbox" value="' + String(t).replace(/"/g,"&quot;") + '">'
                  + '<span class="pop-box">' + CHECK + '</span><span class="lbl">' + t + '</span>';
      list.appendChild(l);
    });
    pop.querySelector(".pop-find").addEventListener("input", function(e){
      var q = e.target.value.toLowerCase();
      list.querySelectorAll(".pop-item").forEach(function(it){
        it.style.display = it.querySelector(".lbl").textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none";
      });
    });
    btn.onclick = function(e){
      e.stopPropagation();
      document.querySelectorAll(".pop.open").forEach(function(o){ if (o !== pop) o.classList.remove("open"); });
      pop.classList.toggle("open");
    };
    document.addEventListener("click", function(e){ if (!wrap.contains(e.target)) pop.classList.remove("open"); });
    pop.querySelector(".app").onclick = function(){ pop.classList.remove("open"); applyPicks(); };
    pop.querySelector(".clr").onclick = function(){
      pop.querySelectorAll("input:checked").forEach(function(i){ i.checked = false; }); applyPicks();
    };
    wrap.appendChild(btn); wrap.appendChild(pop);
    wrap._picked = function(){
      return [].slice.call(pop.querySelectorAll("input:checked")).map(function(i){ return i.value; });
    };
    wrap._badge = btn.querySelector(".n"); wrap._btn = btn; wrap._pop = pop;
    return wrap;
  }

  var pop1 = makePop(CFG.g1, G1, CFG.cols1);
  var pop2 = makePop(CFG.g2, G2, CFG.cols2);

  function clearPicks(){
    [pop1, pop2].forEach(function(w){
      w._pop.querySelectorAll("input:checked").forEach(function(i){ i.checked = false; });
    });
  }
  /* within a group: OR.  across the two groups: AND. */
  function applyPicks(){
    var a = pop1._picked(), b = pop2._picked();
    [[pop1,a],[pop2,b]].forEach(function(p){
      p[0]._badge.hidden = p[1].length === 0;
      p[0]._badge.textContent = p[1].length;
      p[0]._btn.classList.toggle("has-picks", p[1].length > 0);
    });
    if (a.length || b.length){
      [bAll,bFav,bRec].forEach(function(x){ if (x) x.setAttribute("aria-pressed","false"); });
    }
    var rows = (typeof window[CFG.data] !== "undefined") ? window[CFG.data]
             : (CFG.dataFn ? CFG.dataFn() : []);
    var meta = {};
    (rows || []).forEach(function(r){
      meta[String(CFG.title(r)).trim()] = { g1: CFG.f1(r), g2: CFG.f2(r) };
    });
    document.querySelectorAll("#grid .sb-item, #grid > *").forEach(function(wrapEl){
      var t = wrapEl.querySelector("." + CFG.titleClass);
      if (!t) return;
      var m = meta[t.textContent.trim()];
      var okA = !a.length || (m && m.g1.some(function(x){ return a.indexOf(x) >= 0; }));
      var okB = !b.length || (m && m.g2.some(function(x){ return b.indexOf(x) >= 0; }));
      wrapEl.style.display = (okA && okB) ? "" : "none";
    });
  }

  function proxy(btn, src){
    if (!btn) return;
    btn.onclick = function(){
      [bAll,bFav,bRec].forEach(function(x){ if (x) x.setAttribute("aria-pressed","false"); });
      btn.setAttribute("aria-pressed","true");
      clearPicks();
      if (src) src.click();
      applyPicks();
    };
  }
  proxy(bAll, srcAll); proxy(bFav, srcFav); proxy(bRec, srcRec);

  var parts = [bAll];
  if (bFav) parts.push(bFav);
  if (bRec) parts.push(bRec);
  var s1 = document.createElement("span"); s1.className = "sb-sep";
  parts.push(s1, pop1, pop2);
  parts.forEach(function(el){ bar.appendChild(el); });
  chips.parentNode.insertBefore(bar, chips.nextSibling);

  var grid = document.getElementById("grid");
  if (grid) new MutationObserver(function(){ applyPicks(); }).observe(grid, { childList:true });

  function syncModes(){
    if (bFav) bFav.style.display = (srcFav && srcFav.hidden) ? "none" : "";
    if (bRec) bRec.style.display = (srcRec && srcRec.hidden) ? "none" : "";
  }
  syncModes();
  new MutationObserver(syncModes).observe(chips, { attributes:true, subtree:true, attributeFilter:["hidden"] });
})();

/* tuck the bar on the way down, bring it back on the way up */
(function sbTuck(){
  var last = window.scrollY, bar = null, threshold = 90;
  window.addEventListener("scroll", function(){
    bar = bar || document.querySelector(".controls");
    if (!bar) return;
    var y = window.scrollY, down = y > last;
    if (y > threshold && down) bar.classList.add("is-tucked");
    else if (!down) bar.classList.remove("is-tucked");
    last = y;
  }, { passive:true });
})();
</script>
