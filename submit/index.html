<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit — Collatera</title>
<link rel="stylesheet" href="/assets/styles.css?v=7">
</head>
<body>

<div class="rf-bg" aria-hidden="true"></div>
<div class="rf-wash" aria-hidden="true"></div>
<div class="rf-slab" aria-hidden="true"></div>

<script>window.COLLATERA_SECTION = "Submit";</script>
<script src="/assets/site.js?v=7"></script>

<main class="sub-main">
  <!-- signed out -->
  <div id="subOut" class="sub-card" hidden>
    <h2 class="sub-h">Sign in to submit</h2>
    <p class="sub-p">Submissions are reviewed before anything is published.
       Use the account button in the header to sign in.</p>
  </div>

  <!-- signed in -->
  <div id="subIn" hidden>
    <div class="sub-card">
      <h2 class="sub-h">Submit to the library</h2>

      <div class="tl-row">
        <label class="flbl c" for="subKind">What are you submitting?</label>
        <select id="subKind">
          <option value="image">Reference image</option>
          <option value="deck" disabled>Slide deck (coming soon)</option>
          <option value="resource" disabled>Resource link (coming soon)</option>
          <option value="guideline" disabled>Guideline link (coming soon)</option>
        </select>
      </div>

      <label class="flbl c" style="display:block;margin:16px 0 8px">Image file <span class="lbl-q">(required)</span></label>
      <div class="sub-drop" id="subDrop">
        <div class="sub-drop-msg">Drag an image here, paste it, or click to browse</div>
        <div class="sub-drop-sub">JPG or PNG · up to 12 MB</div>
        <input id="subFile" type="file" accept="image/*" hidden>
      </div>
      <div id="subPreviewWrap" class="sub-preview" hidden><img id="subPreview" alt="Preview"></div>

      <div class="tl-row">
        <label class="flbl t" for="subTitle">Title:</label>
        <input id="subTitle" type="text" maxlength="120" placeholder="e.g. Mitral Valve Anatomy">
      </div>

      <div class="ct-wrap">
        <div class="ct-col cat">
          <div class="ct-head"><span class="flbl c">Category:</span> <span class="lbl-q">(required)</span></div>
          <div id="subCatGrid" class="cti-grid cats"></div>
        </div>
        <div class="ct-col tags">
          <div class="ct-head"><span class="flbl g">Tags:</span> <span class="lbl-q">(at least one)</span></div>
          <div id="subTagGrid" class="cti-grid tags"></div>
          <div class="sub-newtag">
            <input id="subNewTag" type="text" maxlength="28" placeholder="Add a tag and press Enter">
          </div>
        </div>
      </div>
      <div id="subChosen" class="sub-chosen"></div>

      <div class="tl-row cap-row">
        <label class="flbl p" for="subNote">Comments:</label>
        <textarea id="subNote" rows="2" maxlength="600"
          placeholder="Anything I should know — source, context, why it's useful"></textarea>
      </div>

      <button id="subSend" class="sub-btn" type="button">Submit for review</button>
      <div id="subMsg" class="sub-msg" role="status"></div>
    </div>

    <div class="sub-card">
      <h2 class="sub-h">Your submissions</h2>
      <div id="subList" class="sub-list">Loading…</div>
    </div>
  </div>
</main>

<style>
.sub-main{max-width:1180px;margin:64px auto 60px;padding:0 20px}
.sub-card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:22px 26px 44px;margin-bottom:20px}
.sub-h{font-size:26px;margin-bottom:14px;text-align:center}
.sub-p{color:var(--muted);font-size:.95em}
.sub-lbl{display:block;margin:16px 0 6px;font-size:.88em;color:var(--muted)}
.sub-req{color:var(--accent-deep);font-size:.92em}
.sub-opt{opacity:.7;font-size:.92em}
.flbl{font-weight:700;font-size:20px}
.flbl.t{color:var(--ink)} .flbl.c{color:var(--brand)} .flbl.g{color:var(--accent-deep)} .flbl.p{color:var(--muted)}
.lbl-q{font-style:italic;font-weight:400;color:var(--muted);font-size:.8em}
.tl-row{display:flex;align-items:center;gap:12px;margin:16px 0 4px}
.tl-row input,.tl-row select,.tl-row textarea{flex:1}
.cap-row{align-items:flex-start}
.cap-row label{padding-top:8px}
.ct-wrap{display:flex;gap:40px;flex-wrap:wrap;margin-top:18px}
.ct-col.cat{flex:0 1 34%;min-width:240px}
.ct-col.tags{flex:1 1 60%;min-width:340px}
.ct-head{margin-bottom:9px}
.sub-main input[type=text],.sub-main select,.sub-main textarea,.sub-main input[type=file]{
  width:100%;box-sizing:border-box;padding:.6em .7em;border:1px solid var(--border);
  border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.sub-main textarea{resize:vertical}
.sub-preview{margin-top:10px}
.sub-preview img{max-width:100%;max-height:260px;border-radius:10px;border:1px solid var(--border)}
/* ghost frame + 6px cushion; single-select category, multi-select tags */
.cti-grid{display:grid;gap:6px;background:transparent}
.cti-grid.cats{grid-template-columns:repeat(2,1fr)}
.cti-grid.tags{grid-template-columns:repeat(5,1fr)}
.cti-tile{padding:15px 11px;font-size:15px;line-height:1.2;text-align:center;cursor:pointer;user-select:none;
  background:var(--bg);color:var(--ink);transition:background .12s}
.cti-tile:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.cti-grid.cats .cti-tile.on{background:color-mix(in srgb,var(--brand) 67%,transparent);
  box-shadow:inset 4px 0 0 var(--brand);color:var(--ink);font-weight:600;position:relative;z-index:1}
.cti-grid.tags .cti-tile.on{background:color-mix(in srgb,var(--accent) 67%,transparent);
  box-shadow:inset 4px 0 0 var(--accent);color:var(--ink);font-weight:600;position:relative;z-index:1}
@media (max-width:560px){ .cti-grid.tags{grid-template-columns:repeat(3,1fr)} }
/* drop zone — 2x tall, centered */
.sub-drop{max-width:720px;margin:0 auto;min-height:220px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;border:1.5px dashed var(--border);border-radius:12px;cursor:pointer;
  background:color-mix(in srgb,var(--bg) 70%,transparent);padding:22px;text-align:center;transition:.15s}
.sub-drop.drag{border-color:var(--accent-deep);background:var(--accent-tint)}
.sub-drop-msg{font-size:20px;color:var(--ink)}
.sub-drop-sub{font-size:14px;color:var(--muted);margin-top:5px}
.sub-chosen{font-size:.85em;color:var(--muted);min-height:1.2em;margin-top:6px}
.sub-btn{display:block;margin:26px auto 0;width:auto;padding:.7em 2.8em;border:none;border-radius:11px;
  background:var(--accent);color:var(--pill-ink);font:inherit;font-weight:700;font-size:20px;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.sub-btn:disabled{opacity:.6;cursor:default}
.sub-msg{margin-top:10px;font-size:.9em;min-height:1.2em}
.sub-msg.ok{color:var(--accent-deep)} .sub-msg.err{color:#B23B3B}
.sub-list{font-size:.92em}
.sub-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  padding:.5em 0;border-bottom:1px solid var(--border)}
.sub-row:last-child{border-bottom:none}
.sub-status{font-size:.85em;padding:.15em .7em;border-radius:999px;white-space:nowrap}
.st-pending{background:var(--accent-tint);color:var(--accent-deep)}
.st-approved{background:#DFF3E4;color:#1D7A4C}
.st-rejected{background:#F7E0E0;color:#B23B3B}
.sub-why{font-size:.85em;color:var(--muted);margin-top:.2em}
</style>

<script>
const KNOWN_CATS = [];
let ALL_TAGS = [], chosen = new Set(), ME = null, selectedCat = "", pendingFile = null;

const $ = id => document.getElementById(id);
function msg(t, ok){ const m=$("subMsg"); m.textContent=t; m.className="sub-msg "+(ok?"ok":"err"); }

/* preselect the kind from ?kind= when arriving from a section */
(function presetKind(){
  const k = new URLSearchParams(location.search).get("kind");
  if (k) { const el=$("subKind"); if ([...el.options].some(o=>o.value===k && !o.disabled)) el.value=k; }
})();

/* pull categories + existing tags from the live library */
async function loadLibraryMeta(){
  try{
    const r = await fetch("/data/images.json");
    const d = await r.json();
    KNOWN_CATS.length = 0; (d.categories||[]).forEach(c=>KNOWN_CATS.push(c));
    renderCatGrid();
    ALL_TAGS = [...new Set((d.images||[]).flatMap(i=>i.tags||[]))].sort((a,b)=>a.localeCompare(b));
    renderTagGrid();
  }catch(e){ msg("Couldn't load categories — "+e.message, false); }
}
function renderCatGrid(){
  const g=$("subCatGrid"); g.innerHTML="";
  KNOWN_CATS.forEach(c=>{
    const t=document.createElement("div");
    t.className="cti-tile"+(selectedCat===c?" on":""); t.textContent=c;
    t.onclick=()=>{ selectedCat=c; renderCatGrid(); };
    g.appendChild(t);
  });
}
function renderTagGrid(){
  const g=$("subTagGrid"); g.innerHTML="";
  ALL_TAGS.forEach(t=>{
    const el=document.createElement("div");
    el.className="cti-tile"+(chosen.has(t)?" on":""); el.textContent=t;
    el.onclick=()=>{ chosen.has(t)?chosen.delete(t):chosen.add(t); renderTagGrid(); renderChosen(); };
    g.appendChild(el);
  });
}
function renderChosen(){
  $("subChosen").textContent = chosen.size ? "Selected: "+[...chosen].join(", ") : "No tags selected yet.";
}
$("subNewTag").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  e.preventDefault();
  const v=e.target.value.trim(); if(!v) return;
  if(!ALL_TAGS.includes(v)){ ALL_TAGS.push(v); ALL_TAGS.sort((a,b)=>a.localeCompare(b)); }
  chosen.add(v); e.target.value=""; renderTagGrid(); renderChosen();
});

/* file selection — drag, paste, click-to-browse */
const subDrop=$("subDrop");
subDrop.onclick=()=>$("subFile").click();
$("subFile").addEventListener("change",e=>setFile(e.target.files[0]));
["dragenter","dragover"].forEach(ev=>subDrop.addEventListener(ev,e=>{ e.preventDefault(); subDrop.classList.add("drag"); }));
["dragleave","drop"].forEach(ev=>subDrop.addEventListener(ev,e=>{ e.preventDefault(); subDrop.classList.remove("drag"); }));
subDrop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) setFile(f); });
document.addEventListener("paste",e=>{
  const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.startsWith("image/"));
  if(it) setFile(it.getAsFile());
});
function setFile(f){
  if(!f){ return; }
  pendingFile=f;
  try{ $("subPreview").src=URL.createObjectURL(f); $("subPreviewWrap").hidden=false; }catch(e){}
}

/* submit */
$("subSend").onclick = async () => {
  const sb = window.sb; if(!sb || !ME) return;
  const file=pendingFile || ($("subFile").files && $("subFile").files[0]);
  const title=$("subTitle").value.trim();
  const cat=selectedCat;
  const note=$("subNote").value.trim();
  if(!file)  return msg("Choose an image file.", false);
  if(!title) return msg("A title is required.", false);
  if(!cat)   return msg("Choose a category.", false);
  if(!chosen.size) return msg("Add at least one tag.", false);
  if(file.size > 12*1024*1024) return msg("That file is larger than 12 MB — please resize it first.", false);

  $("subSend").disabled=true; msg("Uploading…", true);
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
  const path=`${ME}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const up = await sb.storage.from("submissions").upload(path, file, { upsert:false });
  if(up.error){ $("subSend").disabled=false; return msg("Upload failed — "+up.error.message, false); }

  const ins = await sb.from("submissions").insert({
    user_id: ME, kind: $("subKind").value, storage_path: path,
    title, cat, tags:[...chosen], note: note||null
  });
  $("subSend").disabled=false;
  if(ins.error) return msg("Couldn't record the submission — "+ins.error.message, false);

  msg("Submitted. It'll appear below as pending until reviewed.", true);
  try{ $("subFile").value=""; }catch(e){} pendingFile=null;
  $("subTitle").value=""; selectedCat=""; renderCatGrid();
  $("subNote").value=""; chosen=new Set(); $("subPreviewWrap").hidden=true;
  renderTagGrid(); renderChosen(); loadMine();
};

/* the submitter's own queue */
async function loadMine(){
  const sb=window.sb; if(!sb||!ME) return;
  const { data, error } = await sb.from("submissions")
    .select("title, cat, status, reject_reason, reject_note, created_at")
    .order("created_at",{ascending:false});
  const box=$("subList");
  if(error){ box.textContent="Couldn't load your submissions."; return; }
  if(!data.length){ box.textContent="Nothing submitted yet."; return; }
  box.innerHTML="";
  data.forEach(r=>{
    const row=document.createElement("div"); row.className="sub-row";
    const why = r.status==="rejected" && (r.reject_reason||r.reject_note)
      ? `<div class="sub-why">${[r.reject_reason,r.reject_note].filter(Boolean).join(" — ")}</div>` : "";
    row.innerHTML=`<div><strong>${r.title}</strong>
        <div class="sub-why">${r.cat} · ${new Date(r.created_at).toLocaleDateString()}</div>${why}</div>
      <span class="sub-status st-${r.status}">${r.status}</span>`;
    box.appendChild(row);
  });
}

/* boot */
(function init(){
  if(!window.sbReady){ setTimeout(init,50); return; }
  window.sbReady.then(async sb=>{
    const paint = async () => {
      const { data:{ session } } = await sb.auth.getSession();
      ME = session?.user?.id || null;
      $("subIn").hidden = !ME; $("subOut").hidden = !!ME;
      if(ME){ await loadLibraryMeta(); renderChosen(); loadMine(); }
    };
    await paint();
    sb.auth.onAuthStateChange(paint);
  });
})();
</script>

<style>
/* ============================================================
   Reference library — page-local background (rf- prefix, no global clash)
   Tiled topographic texture across the page, with ONE shading element:
   constant fill through the core, feathering to nothing across a defined
   band so the outer margins keep the texture at full strength.
   ============================================================ */

body{ position:relative; background:var(--bg); }

.rf-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:var(--rf-tile);
  background-repeat:repeat; background-size:var(--rf-texsize) auto; background-position:center;
  opacity:var(--rf-texop); filter:var(--rf-coral, none);
}

.rf-wash{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:var(--rf-pad); opacity:var(--rf-wash);
}

.rf-slab{
  position:absolute; z-index:0; pointer-events:none;
  left:50%; transform:translateX(-50%);
  width:calc(var(--rf-core) + 2 * var(--rf-band));
  top:calc(var(--rf-top) - var(--rf-band));
  height:calc(100% - var(--rf-top) - var(--rf-bot) + 2 * var(--rf-band));
  background:var(--rf-pad);
  opacity:var(--rf-op);
  border-radius:var(--rf-round);
  -webkit-mask-image:
    linear-gradient(to right, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    linear-gradient(to right, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%);
  mask-composite:intersect;
}

/* page content sits above both layers */
.controls, main, footer{ position:relative; z-index:1; }

/* one frame without the filter on a theme swap, so the composited layer is
   discarded and repaints in the new palette instead of the previous one */
:root.theme-swap .rf-slab, :root.theme-swap .rf-wash{ opacity:0; }

/* ---- page-local tokens (light / dark / auto, mirroring the site) ---- */
:root{
  --rf-tile:url("/assets/collatera-tile-coral.png");
  --rf-coral:saturate(1.52) brightness(0.85) contrast(1.09);
  --rf-pad:#FFFDF8;
  --rf-texop:.55; --rf-texsize:570px; --rf-wash:.73;
  --rf-core:1140px; --rf-band:65px; --rf-op:.62;
  --rf-top:0px; --rf-bot:115px; --rf-round:30px;
}
:root[data-theme="dark"]{
  --rf-tile:url("/assets/collatera-tile-blue.png"); --rf-coral:none;
  --rf-pad:#141C22;
  --rf-texop:.19; --rf-texsize:570px; --rf-wash:0;
  --rf-core:1140px; --rf-band:65px; --rf-op:.80;
  --rf-top:0px; --rf-bot:115px; --rf-round:30px;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
  --rf-tile:url("/assets/collatera-tile-blue.png"); --rf-coral:none;
    --rf-pad:#141C22;
    --rf-texop:.19; --rf-texsize:570px; --rf-wash:0;
    --rf-core:1140px; --rf-band:65px; --rf-op:.80;
    --rf-top:0px; --rf-bot:115px; --rf-round:30px;
  }
}

/* ---- narrow screens: shrink the core so the band still reads ---- */
@media (max-width:1380px){
  :root, :root[data-theme="dark"]{ --rf-core:min(1140px, calc(100vw - 40px)); }
}
@media (max-width:760px){
  :root, :root[data-theme="dark"]{ --rf-core:calc(100vw - 44px); --rf-band:22px; --rf-round:18px; }
}
</style>
</body>
</html>
