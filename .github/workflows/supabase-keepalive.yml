# Keeps the free-tier Supabase project from pausing after 7 idle days.
# Runs a tiny read against the database every 3 days. Nothing is written.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 8 */3 * *"   # every 3 days at 08:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          URL="https://pxustifbonzhldrepcyp.supabase.co/rest/v1/favorites?select=item_id&limit=1"
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            "$URL")
          echo "HTTP $CODE"
          cat /tmp/out.txt
          # 200 = reachable. 401/403 also prove the project is awake and
          # responding (anon simply can't read the table), so accept those too.
          if [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "Project is awake."
          else
            echo "Unexpected response — project may be paused or unreachable."
            exit 1
          fi
