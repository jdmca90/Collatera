<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Education Resource Hub · Collatera</title>
<meta name="description" content="A curated hub of free cardiology self-education resources.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css?v=7">
</head>
<body>

<div class="rf-bg" aria-hidden="true"></div>
<div class="rf-wash" aria-hidden="true"></div>
<div class="rf-slab" aria-hidden="true"></div>


<div class="controls">
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" class="search-input" type="search" placeholder="Search resources, topics, modalities…" autocomplete="off" aria-label="Search resources">
  </div>
  <div class="chips" id="chips" role="tablist" aria-label="Filter by category"></div>
</div>

<main>
  <div class="count" id="count"></div>
  <div class="grid se-grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <strong>Nothing found</strong>
    Try a different word, or pick a different category above.
  </div>
</main>

<footer>collatera.org &middot; a growing resource for physician innovators &middot; est. 2026</footer>

<script>window.COLLATERA_SECTION = "Self-Education Resource Hub";</script>
<script src="/assets/site.js?v=7"></script>

<script>
/* =================================================================
   ====   YOUR RESOURCE CATALOG                                  ====
   ====   To add or edit entries, edit the RESOURCES list below.  ====
   ====   Each entry: cat, name, desc, url.                       ====
   ====   cat MUST be one of the CATEGORIES below — it picks the  ====
   ====   glyph. Card colour rotates automatically through        ====
   ====   --c1..--c6 in list order; you don't set it by hand.     ====
   ================================================================= */

const CATEGORIES = ["ECG", "POCUS", "Advanced imaging", "Interventional", "General"];

const RESOURCES = [
  {"id":"res_88m5v6lc", "cat":"ECG", "name":"LITFL ECG Library", "desc":"Over 100 ECG topics with clinical cases and downloadable tracings", "url":"https://litfl.com/ecg-library/"},
  {"id":"res_2eixmzoh", "cat":"ECG", "name":"Dr. Smith's ECG Blog", "desc":"Occlusion MI and subtle ischaemia, with new cases most weeks", "url":"https://drsmithsecgblog.com/"},
  {"id":"res_ogqv78is", "cat":"ECG", "name":"ECG Wave-Maven", "desc":"Around 600 self-assessment cases from BIDMC, sorted by topic and difficulty", "url":"https://ecg.bidmc.harvard.edu/maven/"},
  {"id":"res_7h4d6qfi", "cat":"ECG", "name":"ECG Made Easier", "desc":"Interactive step-through of a systematic ECG read", "url":"https://litfl.com/ecg-made-easier/"},

  {"id":"res_jby39owg", "cat":"POCUS", "name":"Core Ultrasound — 5 Minute Sono", "desc":"Short cardiac videos: windows, tamponade, RV strain, diastology, VTI", "url":"https://coreultrasound.com/5minsono-cardiac/"},
  {"id":"res_mh8ptskk", "cat":"POCUS", "name":"POCUS 101 — Cardiac Guide", "desc":"Image-dense walkthrough of the focused cardiac exam", "url":"https://www.pocus101.com/cardiac-ultrasound-echocardiography-made-easy-step-by-step-guide/"},
  {"id":"res_l7tnsb8u", "cat":"POCUS", "name":"Utah Anesthesia FOCUS", "desc":"FOCUS versus formal echo, plus an advanced TTE track", "url":"https://echo.anesthesia.med.utah.edu/tee/focus-content/"},
  {"id":"res_jvn8ct4k", "cat":"POCUS", "name":"Stanford Focused Bedside TTE", "desc":"Self-paced course on physics, TTE, lung ultrasound and Doppler", "url":"https://online.stanford.edu/courses/som-y0019-focused-bedside-tte-and-ultrasound"},
  {"id":"res_aexb133z", "cat":"POCUS", "name":"The POCUS Atlas", "desc":"Pathology image archive with a linked evidence atlas", "url":"https://www.thepocusatlas.com/"},
  {"id":"res_5v2ipwqn", "cat":"POCUS", "name":"Resuscitative TEE Project", "desc":"Rescue TEE technique and curated learning resources", "url":"https://www.resuscitativetee.com/learningresources"},

  {"id":"res_ejwevzcg", "cat":"Advanced imaging", "name":"HKU Cardiac MR (edX)", "desc":"CMR course built with SCMR; around 50 downloadable cases, free to audit", "url":"https://www.edx.org/learn/medicine/university-of-hong-kong-advanced-cardiac-imaging-cardiac-magnetic-resonance-cmr"},
  {"id":"res_68qsyxrv", "cat":"Advanced imaging", "name":"HKU Cardiac CT (edX)", "desc":"Companion CT course covering CTA, CT-FFR and TAVR planning", "url":"https://www.edx.org/learn/medicine/university-of-hong-kong-advanced-cardiac-imaging-cardiac-computed-tomography-ct"},
  {"id":"res_bs6uafp0", "cat":"Advanced imaging", "name":"Visible Heart — CMR Tutorial", "desc":"Minnesota primer sitting inside their human cardiac anatomy atlas", "url":"https://www.vhlab.umn.edu/atlas/cardiac-mri-tutorial/index.shtml"},

  {"id":"res_ufqj1mo1", "cat":"Interventional", "name":"Manual of PCI (video series)", "desc":"Brilakis walking chapter by chapter through PCI, on YouTube", "url":"https://www.youtube.com/playlist?list=PLrg6KBVL0GBqabghGLCgqbplSrGQEiHh4"},
  {"id":"res_zb8h4n2z", "cat":"Interventional", "name":"TCTMD", "desc":"Conference coverage, slide decks, submitted cases and live-case video", "url":"https://www.tctmd.com/"},
  {"id":"res_3bx6a860", "cat":"Interventional", "name":"PCR Online — Webinars", "desc":"Post-graduate webinars from the EuroPCR community", "url":"https://www.pcronline.com/Courses/Online-Education"},

  {"id":"res_ctpkr94j", "cat":"General", "name":"CardioNerds", "desc":"Case-based cardiology podcast with expert deep dives", "url":"https://www.cardionerds.com/"},
  {"id":"res_5zpk1n2e", "cat":"General", "name":"CardioNerds Infographics", "desc":"Hundreds of infographics indexed by cardiovascular topic", "url":"https://www.cardionerds.com/infographics/"},
  {"id":"res_7g5g66z4", "cat":"General", "name":"This Week in Cardiology", "desc":"Mandrola's weekly trial appraisal — skeptical, not cynical", "url":"https://www.medscape.com/index/list_10295_0"},
  {"id":"res_7i1p66aa", "cat":"General", "name":"Parallax", "desc":"Long-form interviews with cardiology's leaders, hosted by Ankur Kalra", "url":"https://www.radcliffecardiology.com/podcasts/parallax"},
  {"id":"res_dljq86x9", "cat":"General", "name":"Internet Book of Critical Care", "desc":"Farkas' free textbook; strong ECG, shock and device chapters", "url":"https://emcrit.org/ibcc/toc/"},
  {"id":"res_m9le6mbg", "cat":"General", "name":"Radcliffe Cardiology", "desc":"Open-access reviews, including US Cardiology Review", "url":"https://www.radcliffecardiology.com/"}
];

/* =================================================================
   ====   You normally do NOT need to edit anything below here. ====
   ================================================================= */

const GLYPHS = {
  "ECG": '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 34 H14 Q19 25 24 34 H27.5 L30.5 38 L35 10 L39.5 45 L42.5 34 H46 Q51 21 56 34 H60"/></svg>',
  "POCUS": '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="26.5" y="8" width="11" height="13" rx="3.5"/><path d="M26.5 21 L29.5 30 H34.5 L37.5 21"/><path d="M35 8 C39 3 45 5 43.5 11.5"/><path d="M26 37 A 8 8 0 0 0 38 37"/><path d="M20 44 A 16 16 0 0 0 44 44"/><path d="M14 51 A 24 24 0 0 0 50 51"/></svg>',
  "Advanced imaging": '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 50 A 22 22 0 1 1 40 50"/><path d="M26.5 39.5 A 11 11 0 1 1 37.5 39.5"/><path d="M28.5 32 H35.5 L41 54 H23 Z"/></svg>',
  "Interventional": '<svg viewBox="0 0 64 64" fill="currentColor" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M21.5 7 C15.5 14 13 25 14.5 38 C15.3 45 17 51 19.8 56 C18 50 16.8 44 16.6 38 C15.8 26 18 15.5 25.5 7.5 Z"/><path d="M15.4 30 C12 35 10.5 41 11 48 C11.8 42 13.3 36.6 16.4 32.4 Z"/><path d="M31.6 5 C29.5 20 29 36 29.8 56 C31.5 40 32.5 22 35.4 5 Z"/><path d="M30.6 15 C36 20 40.5 28 42.5 40 C39.8 29 35.6 21.5 30 17.8 Z"/><path d="M29.9 30 C34 35 36.6 42 37.4 52 C35.4 43 32.6 36.6 29.3 32.6 Z"/><path d="M34.5 6 C42 8.5 48 13.5 50.5 21 C51.9 25.5 52 32 50 39 C50.8 32 50.4 26 48.8 21.9 C46 14.8 40.6 10 33.8 8.6 Z"/><path d="M49.6 20 C46 26 44 33.5 43.8 44 C42.7 34 43.6 26.4 47.3 19.3 Z"/></svg>',
  "General": '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20 C18 16 27 17 32 22 C37 17 46 16 56 20 L56 46 C46 44 37 45 32 50 C27 45 18 44 8 46 Z"/><path d="M32 41 C26 36.5 22.5 33 22.5 29.5 C22.5 26.5 24.8 24.5 27.5 24.5 C29.4 24.5 31 25.5 32 27.2 C33 25.5 34.6 24.5 36.5 24.5 C39.2 24.5 41.5 26.5 41.5 29.5 C41.5 33 38 36.5 32 41 Z"/></svg>'
};

const catColors = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];

const grid = document.getElementById("grid");
const chipsEl = document.getElementById("chips");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");

let activeCat = null;
let query = "";

function chipButton(label, value) {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = label;
  b.setAttribute("role", "tab");
  b.setAttribute("aria-pressed", activeCat === value ? "true" : "false");
  b.onclick = () => {
    activeCat = value;
    [...chipsEl.querySelectorAll(".chip")].forEach(c => c.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", "true");
    render();
  };
  return b;
}

function buildChips() {
  chipsEl.appendChild(chipButton("All", null));
  const starred = chipButton("Starred", "__starred"); starred.id = "chipStarred";
  const recent  = chipButton("Recently viewed", "__recent"); recent.id = "chipRecent";
  chipsEl.appendChild(starred); chipsEl.appendChild(recent);
  updateModeChips();
  const sep = document.createElement("span");
  sep.className = "chip-sep"; sep.setAttribute("aria-hidden", "true");
  chipsEl.appendChild(sep);
  CATEGORIES.forEach(c => chipsEl.appendChild(chipButton(c, c)));
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[ch]));
}

function render() {
  const q = query.trim().toLowerCase();

  let visible = RESOURCES
    .map((r, i) => ({ r, i }))
    .filter(({ r }) => {
      if (activeCat === "__starred") { if (!FAVES.has(r.id)) return false; }
      else if (activeCat === "__recent") { if (!RECENTS.has(r.id)) return false; }
      else if (activeCat && r.cat !== activeCat) return false;
      if (!q) return true;
      return (r.name + " " + r.desc + " " + r.cat).toLowerCase().includes(q);
    });

  if (activeCat === "__recent") {
    visible.sort((a, b) => (RECENTS.get(b.r.id)||0) - (RECENTS.get(a.r.id)||0));
  } else if (ME) {
    visible.sort((a, b) => {
      const ta = cfavTier(a.r), tb = cfavTier(b.r);
      if (ta !== tb) return ta - tb;
      if (ta === 1) return (RECENTS.get(b.r.id)||0) - (RECENTS.get(a.r.id)||0);
      return a.i - b.i;
    });
  }

  grid.innerHTML = "";
  visible.forEach(({ r, i }, n) => {
    const wrap = document.createElement("div");
    wrap.className = "cfav-host";
    const a = document.createElement("a");
    a.className = "se-card";
    a.href = r.url; a.target = "_blank"; a.rel = "noopener";
    a.onclick = () => recordView(r);
    a.style.setProperty("--cat", catColors[i % catColors.length]);
    a.style.animationDelay = (Math.min(n, 18) * 0.03) + "s";
    a.innerHTML = `<span class="se-glyph">${GLYPHS[r.cat] || ""}</span>
      <span class="se-title">${esc(r.name)}</span>
      <span class="se-desc">${esc(r.desc)}</span>`;
    wrap.appendChild(a);
    if (ME) wrap.appendChild(makeStar(r));
    grid.appendChild(wrap);
  });

  const t = visible.length;
  let label = `${t} ${t === 1 ? "resource" : "resources"}`;
  if (activeCat === "__starred") label += ` \u00b7 starred`;
  else if (activeCat === "__recent") label += ` \u00b7 recently viewed`;
  else if (activeCat) label += ` in ${activeCat}`;
  if (q) label += ` matching \u201c${query.trim()}\u201d`;
  countEl.textContent = label;
  emptyEl.style.display = t ? "none" : "block";
  grid.style.display = t ? "grid" : "none";
}



const CFAV_SOURCE = "resource";

/* =================================================================
   FAVORITES + RECENTS  (per-user, requires login)
   Star each card; starred items lead, then anything opened in the
   last RECENT_WINDOW_DAYS, then the rest. Chips filter explicitly.
   Relies on window.sb / window.sbReady from site.js.
   ================================================================= */
const RECENT_WINDOW_DAYS = 14;
let FAVES = new Set();
let RECENTS = new Map();
let ME = null;

(function injectFavCss(){
  const s = document.createElement("style");
  s.textContent = `
    .cfav-host{position:relative}
    .cfav-star{position:absolute;top:.4rem;right:.4rem;z-index:2;
      width:1.9rem;height:1.9rem;display:flex;align-items:center;justify-content:center;
      font-size:1.15rem;line-height:1;border-radius:50%;cursor:pointer;border:none;
      background:rgba(0,0,0,.34);color:#fff;transition:transform .1s ease, background .15s}
    .cfav-star:hover{transform:scale(1.12);background:rgba(0,0,0,.52)}
    .cfav-star.is-on{color:#FFD24A}
    .cfav-star:focus-visible{outline:2px solid var(--accent,#85CCCC);outline-offset:2px}
  `;
  document.head.appendChild(s);
})();

function setStar(s, on){
  s.classList.toggle("is-on", on);
  s.textContent = on ? "\u2605" : "\u2606";
  s.setAttribute("aria-pressed", on ? "true" : "false");
  s.setAttribute("aria-label", on ? "Remove from favorites" : "Add to favorites");
}
function syncStars(id){
  document.querySelectorAll('.cfav-star[data-cfav-id="' + id + '"]')
    .forEach(el => setStar(el, FAVES.has(id)));
}
function makeStar(item){
  const s = document.createElement("span");
  s.className = "cfav-star";
  s.dataset.cfavId = item.id;
  s.setAttribute("role","button");
  s.setAttribute("tabindex","0");
  setStar(s, FAVES.has(item.id));
  const activate = (e) => { e.preventDefault(); e.stopPropagation(); toggleFav(item.id); };
  s.addEventListener("click", activate);
  s.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") activate(e); });
  return s;
}

async function toggleFav(id){
  if (!ME || !window.sb) return;
  const wasOn = FAVES.has(id);
  if (wasOn) FAVES.delete(id); else FAVES.add(id);
  syncStars(id);
  let error;
  if (wasOn) {
    ({ error } = await window.sb.from("favorites").delete()
        .eq("item_id", id).eq("source", CFAV_SOURCE));
  } else {
    ({ error } = await window.sb.from("favorites")
        .upsert({ user_id: ME, item_id: id, source: CFAV_SOURCE }, { onConflict: "user_id,item_id" }));
  }
  if (error) {
    if (wasOn) FAVES.add(id); else FAVES.delete(id);
    syncStars(id);
    console.warn("favorite toggle failed:", error.message);
  }
}

async function recordView(item){
  if (!ME || !window.sb || !item) return;
  RECENTS.set(item.id, Date.now());
  const { error } = await window.sb.from("recent_views")
    .upsert({ user_id: ME, item_id: item.id, source: CFAV_SOURCE, viewed_at: new Date().toISOString() },
            { onConflict: "user_id,item_id" });
  if (error) console.warn("recordView failed:", error.message);
}

async function loadUserData(){
  const sb = await window.sbReady;
  const { data: { session } } = await sb.auth.getSession();
  ME = session?.user?.id || null;
  FAVES = new Set(); RECENTS = new Map();
  if (!ME) return;
  const [f, r] = await Promise.all([
    sb.from("favorites").select("item_id").eq("source", CFAV_SOURCE),
    sb.from("recent_views").select("item_id, viewed_at").eq("source", CFAV_SOURCE)
  ]);
  if (!f.error && f.data) for (const row of f.data) FAVES.add(row.item_id);
  if (!r.error && r.data) for (const row of r.data) RECENTS.set(row.item_id, new Date(row.viewed_at).getTime());
}

/* tier: 0 starred, 1 recent (within window), 2 everything else */
function cfavTier(item){
  if (!ME) return 2;
  if (FAVES.has(item.id)) return 0;
  const t = RECENTS.get(item.id) || 0;
  return t >= (Date.now() - RECENT_WINDOW_DAYS * 86400000) ? 1 : 2;
}

function updateModeChips(){
  const show = !!ME;
  const cs = document.getElementById("chipStarred");
  const cr = document.getElementById("chipRecent");
  if (cs) cs.style.display = show ? "" : "none";
  if (cr) cr.style.display = show ? "" : "none";
}

document.addEventListener("collatera:recents-cleared", () => { RECENTS = new Map(); render(); });

(function initUser(){
  if (!window.sbReady) { setTimeout(initUser, 50); return; }
  window.sbReady.then(async (sb) => {
    await loadUserData(); updateModeChips(); render();
    sb.auth.onAuthStateChange(async () => { await loadUserData(); updateModeChips(); render(); });
  });
})();


/* bootstrap last: the shared favorites block above must be
   initialised before buildChips()/render() reference it */
searchEl.addEventListener("input", (e) => { query = e.target.value; render(); });
buildChips(); render();
</script>

<style>
/* ============================================================
   Reference library — page-local background (rf- prefix, no global clash)
   Tiled topographic texture across the page, with ONE shading element:
   constant fill through the core, feathering to nothing across a defined
   band so the outer margins keep the texture at full strength.
   ============================================================ */

body{ position:relative; background:var(--bg); }

.rf-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:var(--rf-tile);
  background-repeat:repeat; background-size:var(--rf-texsize) auto; background-position:center;
  opacity:var(--rf-texop); filter:var(--rf-coral, none);
}

.rf-wash{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:var(--rf-pad); opacity:var(--rf-wash);
}

.rf-slab{
  position:absolute; z-index:0; pointer-events:none;
  left:50%; transform:translateX(-50%);
  width:calc(var(--rf-core) + 2 * var(--rf-band));
  top:calc(var(--rf-top) - var(--rf-band));
  height:calc(100% - var(--rf-top) - var(--rf-bot) + 2 * var(--rf-band));
  background:var(--rf-pad);
  opacity:var(--rf-op);
  border-radius:var(--rf-round);
  -webkit-mask-image:
    linear-gradient(to right, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    linear-gradient(to right, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%);
  mask-composite:intersect;
}

/* page content sits above both layers */
.controls, main, footer{ position:relative; z-index:1; }

/* one frame without the filter on a theme swap, so the composited layer is
   discarded and repaints in the new palette instead of the previous one */
:root.theme-swap .rf-slab, :root.theme-swap .rf-wash{ opacity:0; }

/* ---- page-local tokens (light / dark / auto, mirroring the site) ---- */
:root{
  --rf-tile:url("/assets/collatera-tile-coral.png");
  --rf-coral:saturate(1.52) brightness(0.85) contrast(1.09);
  --rf-pad:#FFFDF8;
  --rf-texop:.55; --rf-texsize:570px; --rf-wash:.73;
  --rf-core:1220px; --rf-band:65px; --rf-op:.62;
  --rf-top:0px; --rf-bot:115px; --rf-round:30px;
}
:root[data-theme="dark"]{
  --rf-tile:url("/assets/collatera-tile-blue.png"); --rf-coral:none;
  --rf-pad:#141C22;
  --rf-texop:.19; --rf-texsize:570px; --rf-wash:0;
  --rf-core:1300px; --rf-band:65px; --rf-op:.80;
  --rf-top:0px; --rf-bot:115px; --rf-round:30px;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
  --rf-tile:url("/assets/collatera-tile-blue.png"); --rf-coral:none;
    --rf-pad:#141C22;
    --rf-texop:.19; --rf-texsize:570px; --rf-wash:0;
    --rf-core:1300px; --rf-band:65px; --rf-op:.80;
    --rf-top:0px; --rf-bot:115px; --rf-round:30px;
  }
}

/* ---- narrow screens: shrink the core so the band still reads ---- */
@media (max-width:1380px){
  :root, :root[data-theme="dark"]{ --rf-core:min(1300px, calc(100vw - 130px)); }
}
@media (max-width:760px){
  :root, :root[data-theme="dark"]{ --rf-core:calc(100vw - 44px); --rf-band:22px; --rf-round:18px; }
}
</style>
</body>
</html>
