<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Decks · Collatera</title>
<meta name="description" content="A personal repository of presentation slide decks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css?v=7">
</head>
<body>

<div class="rf-bg" aria-hidden="true"></div>
<div class="rf-wash" aria-hidden="true"></div>
<div class="rf-slab" aria-hidden="true"></div>


<!-- Search + filter chips (the shared header/banner are injected by site.js above) -->
<div class="controls">
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" class="search-input" type="search" placeholder="Search titles, notes, tags…" autocomplete="off" aria-label="Search the slide decks">
  </div>
  <div class="chips" id="chips" role="tablist" aria-label="Filter by category or tag"></div>
</div>

<main>
  <div class="count" id="count"></div>
  <div class="grid decks" id="grid"></div>
  <div class="empty" id="empty" style="display:none">
    <strong>Nothing found</strong>
    Try a different word, or pick a different category or tag above.
  </div>
</main>

<footer>collatera.org &middot; a growing resource for physician innovators &middot; est. 2026</footer>

<!-- ---------- Password gate ---------- -->
<div class="decks-gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate-panel">
    <div class="gate-lock" aria-hidden="true">&#128274;</div>
    <div class="gate-title" id="gateTitle">This deck is locked</div>
    <div class="gate-sub" id="gateSub">Enter the passphrase to open it.</div>
    <input class="gate-input" id="gateInput" type="password" autocomplete="off"
           placeholder="Passphrase" aria-label="Passphrase">
    <div class="gate-err" id="gateErr" role="alert" hidden>That passphrase doesn't match. Try again.</div>
    <div class="gate-actions">
      <button class="gate-btn ghost" id="gateCancel" type="button">Cancel</button>
      <button class="gate-btn solid" id="gateGo" type="button">Open deck</button>
    </div>
  </div>
</div>

<!-- ---------- Deck viewer ---------- -->
<div class="dv" id="dv" role="dialog" aria-modal="true" aria-labelledby="dvTitle">
  <div class="dv-bar">
    <button class="dv-btn" id="dvRailBtn" aria-label="Show or hide slide thumbnails" aria-pressed="true">&#9776;</button>
    <span class="dv-title" id="dvTitle"></span>
    <span class="spacer"></span>
    <span class="dv-counter" id="dvCounter">— / —</span>
    <button class="dv-btn" id="dvFull" aria-label="Toggle fullscreen">&#9974;</button>
    <button class="dv-btn" id="dvClose" aria-label="Close deck">&#10005;</button>
  </div>
  <div class="dv-body">
    <div class="dv-rail" id="dvRail" aria-label="Slide thumbnails"></div>
    <div class="dv-stage" id="dvStage">
      <button class="dv-nav dv-prev" id="dvPrev" aria-label="Previous slide">&#8249;</button>
      <div class="dv-canvas-wrap" id="dvCanvasWrap">
        <canvas id="dvCanvas"></canvas>
        <div class="dv-loading" id="dvLoading">Loading deck…</div>
      </div>
      <button class="dv-nav dv-next" id="dvNext" aria-label="Next slide">&#8250;</button>
    </div>
  </div>
</div>

<!-- shared header / nav / banner -->
<script>window.COLLATERA_SECTION = "Slide Decks";</script>
<script src="/assets/site.js?v=7"></script>

<!-- pdf.js (UMD build; exposes window.pdfjsLib) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
/* =================================================================
   ====   YOUR DECKS LIVE IN  /data/decks.json  —  YOU SHOULD    ====
   ====   NOT NEED TO EDIT THIS FILE TO ADD A DECK.              ====
   =================================================================

   Each deck entry in decks.json has:
     file:  "/decks/files/your-deck.pdf"   the PDF itself
     cover: "/decks/covers/your-deck.jpg"  page-1 image shown on the card
     title: "What it's called"             shown on the card
     cat:   "Journal club"                 ONE primary category
     tags:  ["STEMI", "DAPT"]              ANY number of cross-cutting tags
     note:  "A short description."         optional
     date:  "2025-01-09"                   optional, shown on the card
     slides: 45                            optional, shown on the card

   The passphrase gate is a convenience, not security: the PDFs sit at
   public URLs in a public repo. Don't put anything here you'd mind a
   stranger reading.
   ================================================================= */

const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* SHA-256 of the passphrase. Same approach as the uploader gate.
   To change it, run in any browser console:
     crypto.subtle.digest("SHA-256", new TextEncoder().encode("newpass"))
       .then(b => console.log([...new Uint8Array(b)]
         .map(x => x.toString(16).padStart(2,"0")).join("")));            */
const PASS_HASH = "242ab4ac31522e28fb16163c45c0c19e4402c4a32bcb3b144e7c2edce675b150";

let CATEGORIES = [];
let DECKS = [];
let ALL_TAGS = [];

const catColors = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const colorFor = (cat) => {
  const i = CATEGORIES.indexOf(cat);
  return i >= 0 ? catColors[i % catColors.length] : "var(--border)";
};

const grid    = document.getElementById("grid");
const chipsEl = document.getElementById("chips");
const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
const searchEl= document.getElementById("search");

let activeFilter = { type: "all", value: null };
let query = "";
let visible = [];

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ----- chip row: All · Recent · Most used · | · categories · | · tags ----- */
function chipButton(label, type, value, isTag) {
  const b = document.createElement("button");
  b.className = "chip" + (isTag ? " is-tag" : "");
  b.textContent = label;
  b.setAttribute("role","tab");
  const pressed = activeFilter.type === type && activeFilter.value === value;
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.onclick = () => {
    activeFilter = { type, value };
    [...chipsEl.querySelectorAll(".chip")].forEach(c => c.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    render();
  };
  return b;
}
function buildChips() {
  chipsEl.appendChild(chipButton("All", "all", null, false));
  const recent = chipButton("Recent", "recent", null, false);
  recent.classList.add("is-mode"); recent.classList.remove("is-tag");
  const most = chipButton("Most used", "mostused", null, false);
  most.classList.add("is-mode"); most.classList.remove("is-tag");
  chipsEl.appendChild(recent); chipsEl.appendChild(most);
  const sep0 = document.createElement("span");
  sep0.className = "chip-sep"; sep0.setAttribute("aria-hidden","true");
  chipsEl.appendChild(sep0);
  CATEGORIES.forEach(cat => chipsEl.appendChild(chipButton(cat, "cat", cat, false)));
  if (ALL_TAGS.length) {
    const sep = document.createElement("span");
    sep.className = "chip-sep"; sep.setAttribute("aria-hidden","true");
    chipsEl.appendChild(sep);
    ALL_TAGS.forEach(tag => chipsEl.appendChild(chipButton(tag, "tag", tag, true)));
  }
}

/* ----- render the grid ----- */
function matchesFilter(d) {
  if (activeFilter.type === "cat") return d.cat === activeFilter.value;
  if (activeFilter.type === "tag") return (d.tags || []).includes(activeFilter.value);
  return true;
}
function prettyDate(iso) {
  if (!iso) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
  if (!m) return iso;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[+m[2]-1]} ${+m[3]}, ${m[1]}`;
}
function render() {
  const q = query.trim().toLowerCase();
  const views = CollateraViews.all();
  const mode = activeFilter.type;

  visible = DECKS.filter(d => {
    if (!matchesFilter(d)) return false;
    const hay = (d.title + " " + d.cat + " " + (d.note||"") + " " + (d.tags||[]).join(" ")).toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (mode === "recent" || mode === "mostused") return !!views[d.file];
    return true;
  });

  if (mode === "recent") {
    visible.sort((a,b) => (views[b.file]?.t||0) - (views[a.file]?.t||0));
  } else if (mode === "mostused") {
    visible.sort((a,b) => (views[b.file]?.c||0) - (views[a.file]?.c||0));
  } else {
    visible.sort((a,b) => CollateraViews.score(views[b.file]) - CollateraViews.score(views[a.file]));
  }

  grid.innerHTML = "";
  visible.forEach((d, i) => {
    const card = document.createElement("button");
    card.className = "card deckcard";
    card.style.setProperty("--cat", colorFor(d.cat));
    card.style.animationDelay = (Math.min(i, 18) * 0.03) + "s";
    card.onclick = () => requestDeck(i);
    const meta = [prettyDate(d.date), d.slides ? d.slides + " slides" : ""].filter(Boolean).join(" · ");
    card.innerHTML = `
      <span class="deck-lock" aria-hidden="true">&#128274;</span>
      <img class="thumb deck-thumb" src="${encodeURI(d.cover || "")}" alt="" loading="lazy"
           onerror="this.style.opacity=.25;this.alt='';">
      <div class="card-body">
        <span class="card-cat" style="background:${colorFor(d.cat)}">${esc(d.cat)}</span>
        <span class="card-title">${esc(d.title)}</span>
        ${meta ? `<span class="deck-meta">${esc(meta)}</span>` : ""}
      </div>`;
    grid.appendChild(card);
  });

  const n = visible.length;
  let label = `${n} ${n === 1 ? "deck" : "decks"}`;
  if (activeFilter.type === "cat") label += ` in ${activeFilter.value}`;
  if (activeFilter.type === "tag") label += ` tagged #${activeFilter.value}`;
  if (mode === "recent") label += ` · recently viewed`;
  if (mode === "mostused") label += ` · most used`;
  if (q) label += ` matching “${query.trim()}”`;
  countEl.textContent = label;
  emptyEl.style.display = n ? "none" : "block";
  grid.style.display = n ? "grid" : "none";
}

/* =================================================================
   PASSPHRASE GATE
   Unlocks for the browser session only (sessionStorage), so you type
   it once per visit rather than once per deck.
   ================================================================= */
const gate      = document.getElementById("gate");
const gateInput = document.getElementById("gateInput");
const gateErr   = document.getElementById("gateErr");
const gateSub   = document.getElementById("gateSub");
const UNLOCK_KEY = "collatera_decks_unlocked_v1";
let pendingIndex = null;

const isUnlocked = () => {
  try { return sessionStorage.getItem(UNLOCK_KEY) === "1"; } catch { return false; }
};
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}
function requestDeck(i) {
  if (isUnlocked()) { openDeck(i); return; }
  pendingIndex = i;
  gateErr.hidden = true;
  gateInput.value = "";
  gateSub.textContent = `“${visible[i].title}” is locked.`;
  gate.classList.add("open");
  document.body.style.overflow = "hidden";
  setTimeout(() => gateInput.focus(), 30);
}
function closeGate() {
  gate.classList.remove("open");
  if (!document.getElementById("dv").classList.contains("open")) document.body.style.overflow = "";
  pendingIndex = null;
}
async function submitGate() {
  const hex = await sha256Hex(gateInput.value);
  if (hex !== PASS_HASH) {
    gateErr.hidden = false;
    gateInput.value = "";
    gateInput.focus();
    return;
  }
  try { sessionStorage.setItem(UNLOCK_KEY, "1"); } catch {}
  const i = pendingIndex;
  gate.classList.remove("open");
  pendingIndex = null;
  openDeck(i);
}
document.getElementById("gateGo").onclick = submitGate;
document.getElementById("gateCancel").onclick = closeGate;
gateInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitGate(); });
gate.onclick = (e) => { if (e.target === gate) closeGate(); };

/* =================================================================
   DECK VIEWER  (pdf.js)
   ================================================================= */
const dv        = document.getElementById("dv");
const dvCanvas  = document.getElementById("dvCanvas");
const dvWrap    = document.getElementById("dvCanvasWrap");
const dvRail    = document.getElementById("dvRail");
const dvTitle   = document.getElementById("dvTitle");
const dvCounter = document.getElementById("dvCounter");
const dvLoading = document.getElementById("dvLoading");

let pdfDoc = null, pageNum = 1, pageCount = 0;
let renderTask = null, pendingPage = null, railObserver = null;

async function openDeck(i) {
  const d = visible[i];
  if (!d) return;
  CollateraViews.record(d.file);

  dv.classList.add("open");
  document.body.style.overflow = "hidden";
  dvTitle.textContent = d.title;
  dvCounter.textContent = "— / —";
  dvRail.innerHTML = "";
  dvLoading.hidden = false;
  dvLoading.textContent = "Loading deck…";
  document.getElementById("dvClose").focus();

  if (railObserver) { railObserver.disconnect(); railObserver = null; }
  if (pdfDoc) { try { await pdfDoc.destroy(); } catch {} pdfDoc = null; }

  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
    const task = pdfjsLib.getDocument({ url: encodeURI(d.file) });
    task.onProgress = ({ loaded, total }) => {
      if (total) dvLoading.textContent = `Loading deck… ${Math.round(loaded/total*100)}%`;
    };
    pdfDoc = await task.promise;
    pageCount = pdfDoc.numPages;
    pageNum = 1;
    dvLoading.hidden = true;
    await renderPage(1);
    buildRail();
  } catch (err) {
    dvLoading.hidden = false;
    dvLoading.textContent = "Couldn't open this deck. Check that the PDF exists at " + d.file;
  }
}

async function renderPage(n) {
  if (!pdfDoc) return;
  if (renderTask) { pendingPage = n; return; }
  pageNum = n;
  dvCounter.textContent = `${n} / ${pageCount}`;
  markRail(n);

  const page = await pdfDoc.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const box  = dvWrap.getBoundingClientRect();
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(box.width / base.width, box.height / base.height) || 1;
  const vp = page.getViewport({ scale: scale * dpr });

  dvCanvas.width  = Math.floor(vp.width);
  dvCanvas.height = Math.floor(vp.height);
  dvCanvas.style.width  = Math.floor(vp.width / dpr) + "px";
  dvCanvas.style.height = Math.floor(vp.height / dpr) + "px";

  renderTask = page.render({ canvasContext: dvCanvas.getContext("2d"), viewport: vp });
  try { await renderTask.promise; } catch {}
  renderTask = null;

  if (pendingPage !== null) { const p = pendingPage; pendingPage = null; renderPage(p); }
}

/* Thumbnail rail — rendered lazily, only when a thumb scrolls into view,
   so a 45-slide deck doesn't rasterise 45 pages up front. */
function buildRail() {
  dvRail.innerHTML = "";
  railObserver = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target;
      railObserver.unobserve(el);
      renderThumb(el, +el.dataset.page);
    });
  }, { root: dvRail, rootMargin: "300px" });

  for (let i = 1; i <= pageCount; i++) {
    const b = document.createElement("button");
    b.className = "dv-thumb" + (i === pageNum ? " current" : "");
    b.dataset.page = i;
    b.setAttribute("aria-label", `Slide ${i}`);
    b.innerHTML = `<canvas></canvas><span class="dv-thumb-n">${i}</span>`;
    b.onclick = () => renderPage(i);
    dvRail.appendChild(b);
    railObserver.observe(b);
  }
}
async function renderThumb(btn, n) {
  try {
    const page = await pdfDoc.getPage(n);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 150 / base.width });
    const c = btn.querySelector("canvas");
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    btn.classList.add("ready");
  } catch {}
}
function markRail(n) {
  dvRail.querySelectorAll(".dv-thumb").forEach(t => {
    const on = +t.dataset.page === n;
    t.classList.toggle("current", on);
    if (on) t.scrollIntoView({ block: "nearest" });
  });
}

function step(d) {
  const n = pageNum + d;
  if (n < 1 || n > pageCount) return;
  renderPage(n);
}
async function closeDeck() {
  dv.classList.remove("open");
  document.body.style.overflow = "";
  if (railObserver) { railObserver.disconnect(); railObserver = null; }
  if (renderTask) { try { renderTask.cancel(); } catch {} renderTask = null; }
  if (pdfDoc) { try { await pdfDoc.destroy(); } catch {} pdfDoc = null; }
  dvRail.innerHTML = "";
}
document.getElementById("dvClose").onclick = closeDeck;
document.getElementById("dvPrev").onclick = () => step(-1);
document.getElementById("dvNext").onclick = () => step(1);
document.getElementById("dvRailBtn").onclick = (e) => {
  const hidden = dv.classList.toggle("rail-hidden");
  e.currentTarget.setAttribute("aria-pressed", hidden ? "false" : "true");
  if (pdfDoc) renderPage(pageNum);
};
document.getElementById("dvFull").onclick = () => {
  if (!document.fullscreenElement) dv.requestFullscreen?.();
  else document.exitFullscreen?.();
};

document.addEventListener("keydown", (e) => {
  if (gate.classList.contains("open")) { if (e.key === "Escape") closeGate(); return; }
  if (!dv.classList.contains("open")) return;
  if (e.key === "Escape" && !document.fullscreenElement) closeDeck();
  if (e.key === "ArrowLeft"  || e.key === "PageUp")   { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); step(1); }
  if (e.key === "Home") { e.preventDefault(); renderPage(1); }
  if (e.key === "End")  { e.preventDefault(); renderPage(pageCount); }
});

let resizeTimer = null;
window.addEventListener("resize", () => {
  if (!dv.classList.contains("open") || !pdfDoc) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderPage(pageNum), 150);
});

/* ----- search ----- */
searchEl.addEventListener("input", (e) => { query = e.target.value; render(); });

/* ----- load the decks from decks.json, then go ----- */
fetch("/data/decks.json")
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(data => {
    CATEGORIES = data.categories || [];
    DECKS = data.decks || [];
    ALL_TAGS = [...new Set(DECKS.flatMap(d => d.tags || []))].sort((a,b)=>a.localeCompare(b));
    buildChips();
    render();
  })
  .catch(err => {
    grid.style.display = "none";
    emptyEl.style.display = "block";
    emptyEl.innerHTML = `<strong>Couldn't load the deck list</strong><br>Check that /data/decks.json exists and is valid JSON.<br><span style="opacity:.7">${esc(err.message)}</span>`;
  });
</script>

<style>
/* ============================================================
   Reference library — page-local background (rf- prefix, no global clash)
   Tiled topographic texture across the page, with ONE shading element:
   constant fill through the core, feathering to nothing across a defined
   band so the outer margins keep the texture at full strength.
   ============================================================ */

body{ position:relative; background:var(--bg); }

.rf-bg{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:var(--rf-tile);
  background-repeat:repeat; background-size:var(--rf-texsize) auto; background-position:center;
  opacity:var(--rf-texop); filter:var(--rf-coral, none);
}

.rf-wash{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:var(--rf-pad); opacity:var(--rf-wash);
}

.rf-slab{
  position:absolute; z-index:0; pointer-events:none;
  left:50%; transform:translateX(-50%);
  width:calc(var(--rf-core) + 2 * var(--rf-band));
  top:calc(var(--rf-top) - var(--rf-band));
  height:calc(100% - var(--rf-top) - var(--rf-bot) + 2 * var(--rf-band));
  background:var(--rf-pad);
  opacity:var(--rf-op);
  border-radius:var(--rf-round);
  -webkit-mask-image:
    linear-gradient(to right, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    linear-gradient(to right, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%),
    linear-gradient(to bottom, transparent 0, #000 var(--rf-band), #000 calc(100% - var(--rf-band)), transparent 100%);
  mask-composite:intersect;
}

/* page content sits above both layers */
.controls, main, footer{ position:relative; z-index:1; }

/* one frame without the filter on a theme swap, so the composited layer is
   discarded and repaints in the new palette instead of the previous one */
:root.theme-swap .rf-slab, :root.theme-swap .rf-wash{ opacity:0; }

/* ---- page-local tokens (light / dark / auto, mirroring the site) ---- */
:root{
  --rf-tile:url("/assets/collatera-tile-coral.png");
  --rf-coral:saturate(1.52) brightness(0.85) contrast(1.09);
  --rf-pad:#FFFDF8;
  --rf-texop:.55; --rf-texsize:570px; --rf-wash:.73;
  --rf-core:1220px; --rf-band:65px; --rf-op:.62;
  --rf-top:0px; --rf-bot:115px; --rf-round:30px;
}
:root[data-theme="dark"]{
  --rf-tile:url("/assets/collatera-tile-blue.png"); --rf-coral:none;
  --rf-pad:#141C22;
  --rf-texop:.19; --rf-texsize:570px; --rf-wash:0;
  --rf-core:1300px; --rf-band:65px; --rf-op:.80;
  --rf-top:0px; --rf-bot:115px; --rf-round:30px;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
  --rf-tile:url("/assets/collatera-tile-blue.png"); --rf-coral:none;
    --rf-pad:#141C22;
    --rf-texop:.19; --rf-texsize:570px; --rf-wash:0;
    --rf-core:1300px; --rf-band:65px; --rf-op:.80;
    --rf-top:0px; --rf-bot:115px; --rf-round:30px;
  }
}

/* ---- narrow screens: shrink the core so the band still reads ---- */
@media (max-width:1380px){
  :root, :root[data-theme="dark"]{ --rf-core:min(1300px, calc(100vw - 130px)); }
}
@media (max-width:760px){
  :root, :root[data-theme="dark"]{ --rf-core:calc(100vw - 44px); --rf-band:22px; --rf-round:18px; }
}
/* ============================================================
   Sticky search bar (sb- prefix, page-local)
   One control row: All / Favorites / Recents / Categories / Tags / Echo.
   Sits above the header in stacking order so the header's soft lower edge
   never dims it, and tucks away when scrolling down.
   ============================================================ */
.controls{
  position:sticky; top:var(--sb-top); z-index:60;
  max-width:var(--sb-w); margin:14px auto 6px;
  border-radius:var(--sb-round); padding:var(--sb-pad) 14px;
  border:var(--sb-bw) solid var(--sb-border);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
          backdrop-filter:blur(16px) saturate(140%);
  /* diagonal fade: solid at the top-left, pattern gathering bottom-right */
  background:
    linear-gradient(135deg,
      var(--sb-bg) 0%,
      var(--sb-bg) var(--tile-start),
      color-mix(in srgb, var(--sb-bg) calc(var(--tile-mid) * 100%), transparent) var(--tile-end),
      color-mix(in srgb, var(--sb-bg) calc(var(--tile-low) * 100%), transparent) 100%),
    var(--rf-tile, none);
  background-size:auto, 410px auto;
  background-repeat:no-repeat, repeat;
  background-position:0 0, bottom right;
  box-shadow:0 10px 30px rgba(0,0,0,.28);
  transition:transform .28s cubic-bezier(.22,.61,.36,1), opacity .2s;
}
.controls.is-tucked{
  transform:translateY(calc(-100% - var(--sb-top) - 18px));
  opacity:0; pointer-events:none;
}
:root{
  --sb-top:90px; --sb-w:890px; --sb-round:13px; --sb-pad:9px; --sb-bw:2px;
  --sb-bg:var(--bg); --sb-border:var(--border);
  --sb-fs:12px; --sb-py:5px; --sb-px:10px; --sb-gap:6px;
  --sb-search-h:34px; --sb-stack:9px; --sb-rowgap:4px;
  --pop-w:320px; --pop-wide:490px; --pop-cols:5; --pop-cols-cat:3;
  --tile-start:0%; --tile-end:40%; --tile-mid:.70; --tile-low:0; --sb-glow:3px;
}
:root[data-theme="dark"]{
  --tile-start:44%; --tile-end:84%; --tile-mid:.39; --tile-low:.80; --sb-glow:6px;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --tile-start:44%; --tile-end:84%; --tile-mid:.39; --tile-low:.80; --sb-glow:6px;
  }
}
:root.theme-swap .controls{ opacity:0; }

.search-wrap{ margin:0 0 var(--sb-stack) 0 !important; }
.search-input{ height:var(--sb-search-h) !important; font-size:13.5px !important;
  padding-top:0 !important; padding-bottom:0 !important; }

/* ---- the control row ---- */
#chips{ display:none; }
.sb-bar{ display:flex; flex-wrap:wrap; align-items:center;
  gap:var(--sb-rowgap) var(--sb-gap); }
.sb-btn{
  display:inline-flex; align-items:center; gap:6px; position:relative;
  font:inherit; font-size:var(--sb-fs); font-weight:600;
  padding:var(--sb-py) var(--sb-px); border-radius:999px; cursor:pointer;
  border:1px solid color-mix(in srgb, var(--brand) 42%, transparent);
  background:transparent; color:var(--brand); white-space:nowrap;
  transition:background .16s, color .16s, border-color .16s, box-shadow .16s;
}
/* hover previews the selected state */
.sb-btn:hover{
  background:color-mix(in srgb, var(--brand) 16%, transparent);
  border-color:var(--brand); color:var(--brand);
  box-shadow:inset 0 0 12px color-mix(in srgb, var(--brand) 22%, transparent);
}
.sb-btn[aria-pressed="true"], .sb-btn.has-picks{
  background:color-mix(in srgb, var(--brand) 14%, transparent);
  border-color:var(--brand); color:var(--brand);
  box-shadow:inset 0 0 var(--sb-glow) color-mix(in srgb, var(--brand) 34%, transparent);
}
.sb-btn.is-soon{ opacity:.5; cursor:not-allowed; border-style:dashed; }
.sb-btn.is-soon:hover{ background:transparent; box-shadow:none;
  border-color:color-mix(in srgb, var(--brand) 42%, transparent); }
.sb-btn .caret{ width:0; height:0; border-left:4px solid transparent;
  border-right:4px solid transparent; border-top:5px solid currentColor; opacity:.75; }
.sb-btn .n{ background:var(--accent-deep); color:#fff; border-radius:999px;
  font-size:10px; padding:0 5px; line-height:15px; }
.sb-sep{ width:1px; align-self:stretch; margin:2px 4px;
  background:color-mix(in srgb, var(--brand) 30%, transparent); }

/* ---- checklist popouts ---- */
.pop-wrap{ position:relative; }
.pop{
  position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
  z-index:90; width:var(--pop-w); max-width:calc(var(--sb-w) - 24px);
  border-radius:14px; overflow:hidden; display:none;
  background:var(--surface);
  border:1px solid color-mix(in srgb, var(--brand) 40%, transparent);
  box-shadow:0 20px 50px rgba(0,0,0,.42);
}
.pop.open{ display:block; animation:sbPop .14s ease-out; }
@keyframes sbPop{ from{ opacity:0; transform:translateX(-50%) translateY(-6px) scale(.985); }
                  to{ opacity:1; transform:translateX(-50%); } }
.pop.wide{ width:var(--pop-wide); }
.pop-list{ padding:9px 9px 5px; display:grid; gap:1px 6px;
  grid-template-columns:repeat(var(--pop-cols-cat), minmax(0,1fr)); }
.pop.wide .pop-list{ grid-template-columns:repeat(var(--pop-cols), minmax(0,1fr)); }
.pop-item{ display:flex; align-items:center; gap:8px; padding:5px 7px; border-radius:8px;
  font-size:12.5px; color:var(--ink); cursor:pointer; user-select:none; }
.pop-item:hover{ background:color-mix(in srgb, var(--brand) 10%, transparent); }
.pop-item input{ position:absolute; opacity:0; pointer-events:none; }
.pop-box{ width:15px; height:15px; flex:none; border-radius:5px;
  border:1.5px solid color-mix(in srgb, var(--brand) 50%, transparent);
  display:grid; place-items:center; transition:.13s; }
.pop-item input:checked + .pop-box{ background:var(--brand); border-color:var(--brand); }
.pop-box svg{ width:10px; height:10px; opacity:0; transform:scale(.6); transition:.13s; }
.pop-item input:checked + .pop-box svg{ opacity:1; transform:none; }
/* find field sits at the foot, directly above Apply */
.pop-find{ display:block; box-sizing:border-box; width:calc(100% - 18px); margin:4px 9px 0;
  padding:6px 9px; font:inherit; font-size:12.5px; border-radius:8px;
  border:1px solid color-mix(in srgb, var(--brand) 26%, transparent);
  background:color-mix(in srgb, var(--bg) 60%, transparent); color:var(--ink); }
.pop-foot{ display:flex; gap:8px; padding:8px 9px 10px; }
.pop-foot button{ flex:1; padding:7px; border-radius:9px; cursor:pointer; font:inherit;
  font-size:12px; font-weight:600;
  border:1px solid color-mix(in srgb, var(--brand) 40%, transparent);
  background:transparent; color:var(--ink); }
.pop-foot .primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
.pop-foot button:hover{ filter:brightness(1.06); }

@media (max-width:760px){
  :root{ --sb-w:calc(100vw - 20px); --pop-wide:calc(100vw - 40px); --pop-cols:3; --pop-cols-cat:2; }
}


</style>
<script>

(function sbBuild(){
  var chips = document.getElementById("chips");
  if (!chips) return;
  var all = [].slice.call(chips.querySelectorAll(".chip"));
  if (!all.length) return setTimeout(sbBuild, 120);
  if (document.querySelector(".sb-bar")) return;

  var CFG = { g1:"Type", g2:"Topic", cols1:3, cols2:5, data:"DECKS", dataFn:function(){ return (typeof DECKS!=="undefined")?DECKS:[]; }, titleClass:"card-title", title:function(r){return r.title;}, f1:function(r){return [r.cat];}, f2:function(r){return r.tags||[];} };
  var srcAll=null, srcFav=null, srcRec=null, G1=[], G2=[];
  all.forEach(function(c){
    var t = c.textContent.trim();
    if (t === "All") srcAll = c;
    else if (c.id === "chipStarred") srcFav = c;
    else if (c.id === "chipRecent")  srcRec = c;
    else if (c.classList.contains("is-tag")) G2.push(t);
    else G1.push(t);
  });

  var bar = document.createElement("div"); bar.className = "sb-bar";
  function mk(label, cls){
    var b = document.createElement("button");
    b.type = "button"; b.className = "sb-btn" + (cls ? " " + cls : "");
    b.textContent = label; return b;
  }
  var bAll = mk("All"); bAll.setAttribute("aria-pressed","true");
  var bFav = srcFav ? mk("\u2605 Favorites") : null;
  var bRec = srcRec ? mk("\u2605 Recents")   : null;

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" '
            + 'stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg>';

  function makePop(label, items, cols){
    var wrap = document.createElement("div"); wrap.className = "pop-wrap";
    var btn  = mk(label);
    btn.innerHTML = label + ' <span class="n" hidden>0</span><span class="caret"></span>';
    var pop = document.createElement("div"); pop.className = "pop wide";
    pop.style.setProperty("--pop-cols", cols);
    pop.innerHTML =
      '<div class="pop-list"></div>' +
      '<input class="pop-find" type="search" placeholder="Find ' + label.toLowerCase() + '\u2026" autocomplete="off">' +
      '<div class="pop-foot"><button type="button" class="clr">Clear</button>' +
      '<button type="button" class="primary app">Apply</button></div>';
    var list = pop.querySelector(".pop-list");
    if (!items.length){
      var e = document.createElement("div");
      e.style.cssText = "padding:14px 10px;font-size:12.5px;opacity:.6;grid-column:1/-1;text-align:center";
      e.textContent = "Nothing here yet";
      list.appendChild(e);
    }
    items.forEach(function(t){
      var l = document.createElement("label"); l.className = "pop-item";
      l.innerHTML = '<input type="checkbox" value="' + String(t).replace(/"/g,"&quot;") + '">'
                  + '<span class="pop-box">' + CHECK + '</span><span class="lbl">' + t + '</span>';
      list.appendChild(l);
    });
    pop.querySelector(".pop-find").addEventListener("input", function(e){
      var q = e.target.value.toLowerCase();
      list.querySelectorAll(".pop-item").forEach(function(it){
        it.style.display = it.querySelector(".lbl").textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none";
      });
    });
    btn.onclick = function(e){
      e.stopPropagation();
      document.querySelectorAll(".pop.open").forEach(function(o){ if (o !== pop) o.classList.remove("open"); });
      pop.classList.toggle("open");
    };
    document.addEventListener("click", function(e){ if (!wrap.contains(e.target)) pop.classList.remove("open"); });
    pop.querySelector(".app").onclick = function(){ pop.classList.remove("open"); applyPicks(); };
    pop.querySelector(".clr").onclick = function(){
      pop.querySelectorAll("input:checked").forEach(function(i){ i.checked = false; }); applyPicks();
    };
    wrap.appendChild(btn); wrap.appendChild(pop);
    wrap._picked = function(){
      return [].slice.call(pop.querySelectorAll("input:checked")).map(function(i){ return i.value; });
    };
    wrap._badge = btn.querySelector(".n"); wrap._btn = btn; wrap._pop = pop;
    return wrap;
  }

  var pop1 = makePop(CFG.g1, G1, CFG.cols1);
  var pop2 = makePop(CFG.g2, G2, CFG.cols2);

  function clearPicks(){
    [pop1, pop2].forEach(function(w){
      w._pop.querySelectorAll("input:checked").forEach(function(i){ i.checked = false; });
    });
  }
  /* within a group: OR.  across the two groups: AND. */
  function applyPicks(){
    var a = pop1._picked(), b = pop2._picked();
    [[pop1,a],[pop2,b]].forEach(function(p){
      p[0]._badge.hidden = p[1].length === 0;
      p[0]._badge.textContent = p[1].length;
      p[0]._btn.classList.toggle("has-picks", p[1].length > 0);
    });
    if (a.length || b.length){
      [bAll,bFav,bRec].forEach(function(x){ if (x) x.setAttribute("aria-pressed","false"); });
    }
    var rows = (typeof window[CFG.data] !== "undefined") ? window[CFG.data]
             : (CFG.dataFn ? CFG.dataFn() : []);
    var meta = {};
    (rows || []).forEach(function(r){
      meta[String(CFG.title(r)).trim()] = { g1: CFG.f1(r), g2: CFG.f2(r) };
    });
    document.querySelectorAll("#grid .sb-item, #grid > *").forEach(function(wrapEl){
      var t = wrapEl.querySelector("." + CFG.titleClass);
      if (!t) return;
      var m = meta[t.textContent.trim()];
      var okA = !a.length || (m && m.g1.some(function(x){ return a.indexOf(x) >= 0; }));
      var okB = !b.length || (m && m.g2.some(function(x){ return b.indexOf(x) >= 0; }));
      wrapEl.style.display = (okA && okB) ? "" : "none";
    });
  }

  function proxy(btn, src){
    if (!btn) return;
    btn.onclick = function(){
      [bAll,bFav,bRec].forEach(function(x){ if (x) x.setAttribute("aria-pressed","false"); });
      btn.setAttribute("aria-pressed","true");
      clearPicks();
      if (src) src.click();
      applyPicks();
    };
  }
  proxy(bAll, srcAll); proxy(bFav, srcFav); proxy(bRec, srcRec);

  var parts = [bAll];
  if (bFav) parts.push(bFav);
  if (bRec) parts.push(bRec);
  var s1 = document.createElement("span"); s1.className = "sb-sep";
  parts.push(s1, pop1, pop2);
  parts.forEach(function(el){ bar.appendChild(el); });
  chips.parentNode.insertBefore(bar, chips.nextSibling);

  var grid = document.getElementById("grid");
  if (grid) new MutationObserver(function(){ applyPicks(); }).observe(grid, { childList:true });

  function syncModes(){
    if (bFav) bFav.style.display = (srcFav && srcFav.hidden) ? "none" : "";
    if (bRec) bRec.style.display = (srcRec && srcRec.hidden) ? "none" : "";
  }
  syncModes();
  new MutationObserver(syncModes).observe(chips, { attributes:true, subtree:true, attributeFilter:["hidden"] });
})();

/* tuck the bar on the way down, bring it back on the way up */
(function sbTuck(){
  var last = window.scrollY, bar = null, threshold = 90;
  window.addEventListener("scroll", function(){
    bar = bar || document.querySelector(".controls");
    if (!bar) return;
    var y = window.scrollY, down = y > last;
    if (y > threshold && down) bar.classList.add("is-tucked");
    else if (!down) bar.classList.remove("is-tucked");
    last = y;
  }, { passive:true });
})();
</script>
